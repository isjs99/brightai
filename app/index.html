<title>Brightform Ops Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f5f4f0;--surface:#fdfcfa;--surface-2:#efede8;--surface-3:#e6e3dc;
  --ink:#1d1c19;--muted:#6b6860;--faint:#a19d94;
  --border:#e3e0d9;--border-2:#ecebe6;
  --accent:#3a68ad;--accent-ink:#ffffff;--accent-bg:#e4ecf7;
  --good:#2f8a5a;--good-bg:#e6f2ea;--good-ink:#23643f;
  --warn:#c9a35a;--warn-bg:#f7edd6;--warn-ink:#7d5410;
  --crit:#b04a48;--crit-bg:#f6e3e1;--crit-ink:#8f3a38;
  --info-bg:#e4ecf7;--info-ink:#2d5290;
  --purple-bg:#ece6f6;--purple-ink:#5f4a90;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--grid:#e8e6e0;
  --shadow:0 8px 32px rgba(29,28,25,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151513;--surface:#1d1c1a;--surface-2:#26251f;--surface-3:#302e28;
    --ink:#ebe8e1;--muted:#a39f95;--faint:#6f6b62;
    --border:#2f2e29;--border-2:#282722;
    --accent:#7ea3e0;--accent-ink:#151513;--accent-bg:#1f2b3f;
    --good:#4faa77;--good-bg:#1d3327;--good-ink:#8fd3ac;
    --warn:#c9a35a;--warn-bg:#3a2f16;--warn-ink:#e3c07a;
    --crit:#d06663;--crit-bg:#3d2221;--crit-ink:#eb9a97;
    --info-bg:#1f2b3f;--info-ink:#9fbdf0;
    --purple-bg:#2b2440;--purple-ink:#c3b3ee;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#2a2925;
    --shadow:0 8px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151513;--surface:#1d1c1a;--surface-2:#26251f;--surface-3:#302e28;
  --ink:#ebe8e1;--muted:#a39f95;--faint:#6f6b62;
  --border:#2f2e29;--border-2:#282722;
  --accent:#7ea3e0;--accent-ink:#151513;--accent-bg:#1f2b3f;
  --good:#4faa77;--good-bg:#1d3327;--good-ink:#8fd3ac;
  --warn:#c9a35a;--warn-bg:#3a2f16;--warn-ink:#e3c07a;
  --crit:#d06663;--crit-bg:#3d2221;--crit-ink:#eb9a97;
  --info-bg:#1f2b3f;--info-ink:#9fbdf0;
  --purple-bg:#2b2440;--purple-ink:#c3b3ee;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#2a2925;
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:5px;height:32px;padding:0 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{height:auto;padding:8px 10px;line-height:1.45}
input[type=checkbox]{width:16px;height:16px;padding:0;margin:0;accent-color:var(--ink)}
.mono,.num{font-family:'IBM Plex Mono','SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.h{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.r{text-align:right}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%;overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;padding:16px 16px 12px}
.brand i{width:18px;height:18px;border-radius:4px;background:var(--ink);display:inline-block}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 8px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--surface-2);text-decoration:none}
.nav a.on{background:var(--surface-2);color:var(--ink)}
.nav a svg{flex:none}
.nav .badge{margin-left:auto;background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:0 7px;font-size:11px;font-weight:500;line-height:18px}
.acct-list{flex:1;overflow:auto;padding:8px;border-top:1px solid var(--border-2);margin-top:8px;display:flex;flex-direction:column;gap:1px}
.acct-list .h{padding:6px 10px 6px}
.acct-list a{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:5px;color:var(--ink)}
.acct-list a:hover{background:var(--surface-2);text-decoration:none}
.acct-list a.on{background:var(--surface-2);font-weight:500}
.acct-list a .mk{margin-left:auto;color:var(--faint);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}.dot.off{background:var(--surface-3)}
.me{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.main{display:flex;flex-direction:column;min-height:0;overflow:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600;font-size:15px}
.crumb .sep{color:var(--faint)}
.content{padding:20px 24px 40px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}
.tag.money,.tag.crit{background:var(--crit-bg);color:var(--crit-ink)}
.tag.price,.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.client,.tag.info{background:var(--info-bg);color:var(--info-ink)}
.tag.conf{background:var(--purple-bg);color:var(--purple-ink)}
.tag.ok{background:var(--good-bg);color:var(--good-ink)}
.tag.neutral{background:var(--surface-2);color:var(--muted)}
.btn{height:32px;padding:0 12px;border-radius:5px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:500;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--border);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.mid{vertical-align:middle}
.scroll{overflow-x:auto}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.sec-h .h{color:var(--ink)}
.title{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.tiles{display:flex;gap:10px;flex-wrap:wrap}
.tile{padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:104px}
.tile.warn{border-color:var(--warn);background:var(--warn-bg)}
.tile.warn .h,.tile.warn .num{color:var(--warn-ink)}
.tile.crit{border-color:var(--crit);background:var(--crit-bg)}
.tile.crit .h,.tile.crit .num{color:var(--crit-ink)}
.big{font-size:26px;font-weight:500;line-height:1;letter-spacing:-.01em}
.item{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:20px;padding:14px 16px;border-bottom:1px solid var(--border-2)}
.item:last-child{border-bottom:0}
.item .t{font-weight:500}
.item.done{opacity:.55}
.col{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border-2);gap:12px}
.list-row:last-child{border-bottom:0}
.tabs{display:flex;border-bottom:1px solid var(--border);gap:24px;padding:0 24px;background:var(--surface)}
.tabs a{padding:10px 2px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs a:hover{text-decoration:none;color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}
.subtabs{display:flex;flex-direction:column;gap:2px}
.subtabs a{padding:7px 10px;border-radius:5px;color:var(--muted);font-weight:500}
.subtabs a.on{background:var(--surface-2);color:var(--ink)}
.subtabs a:hover{text-decoration:none;background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{padding:0 10px;height:28px;font-size:12px;color:var(--muted);border:0;border-right:1px solid var(--border-2);background:transparent;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted)}
.field .hint{font-size:11.5px;color:var(--faint)}
.field-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px}
.field-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.unit{display:flex;align-items:center;gap:6px}
.unit input{width:100%}
.unit span{color:var(--muted);white-space:nowrap}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.toggle i{width:34px;height:20px;border-radius:10px;background:var(--surface-3);position:relative;display:inline-block;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.toggle.on i{background:var(--good)}.toggle.on i::after{left:16px}
.note{padding:12px 16px;display:flex;align-items:center;gap:12px}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.crit{border-color:var(--crit);background:var(--crit-bg)}
.note.info{border-color:var(--accent);background:var(--accent-bg)}
.heat{display:grid;gap:3px}
.heat .cell{height:28px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;background:var(--surface-2);color:var(--faint)}
.heat .cell.ok{background:var(--good-bg);color:var(--good-ink)}
.heat .cell.warn{background:var(--warn-bg);color:var(--warn-ink)}
.heat .cell.crit{background:var(--crit-bg);color:var(--crit-ink)}
.heat .cell.na{background:transparent;border:1px dashed var(--border)}
.heat .lbl{font-size:11px;color:var(--muted);display:flex;align-items:center;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .top{font-size:10px;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);height:96px;display:flex;align-items:center;justify-content:flex-start;padding:0 0 0 2px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:'IBM Plex Sans',sans-serif;font-size:11px;fill:var(--muted)}
.chart .ax{stroke:var(--grid);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:5px;font-size:11.5px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}
.modal-bg.open{display:flex}
.modal{width:680px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}
.modal .mh{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.modal .mb{padding:18px 22px;display:flex;flex-direction:column;gap:18px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.check-row{display:grid;grid-template-columns:20px minmax(0,1fr) 110px;gap:12px;padding:9px 14px;border-bottom:1px solid var(--border-2);align-items:start}
.check-row:last-child{border-bottom:0}
.check-row .st{font-size:11.5px;text-align:right;white-space:nowrap}
.pre{white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--surface-2);padding:12px 14px;border-radius:5px;line-height:1.5}
.share-link{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:5px;padding:8px 10px}
.share-link code{font-family:'IBM Plex Mono',monospace;font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark{vertical-align:middle}
.kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:0 5px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width: 1100px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.field-grid{grid-template-columns:1fr 1fr}}
@media (max-width: 800px){.app{grid-template-columns:1fr}.side{display:none}.grid3{grid-template-columns:1fr}.item{grid-template-columns:1fr}}
</style>

<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div id="top" class="topbar"></div>
    <div id="view"></div>
  </main>
</div>
<div class="modal-bg" id="modal"></div>
<div class="toast" id="toast"></div>
<script>
// ---------- mock data (all sample figures; every account other than GreatVita and Bears with Benefits is fictional) ----------
const SECTIONS=['Homepage','Orders','CS, returns, aftercare','Products','Logistics','Marketing','Affiliate','LIVE and video','Growth','Analytics and reports','Account health','Finance','Cruva'];
const FAMILIES=[
 ['listing','Listing hygiene','Attributes, images, category, resubmit'],
 ['promo','Promo renewal, same terms','Duplicate and set live, stock and margin permitting'],
 ['price','Price changes inside rules','Never under the minimum price or the margin floor'],
 ['ads','Ads rebalancing inside cap','Pause under the ROAS floor, shift budget, never above the cap'],
 ['cs','CS replies','From the knowledge library, above confidence'],
 ['affiliate','Affiliate replies','Creator inbox, commission and sample questions'],
 ['outreach','Creator outreach and re-invites','Open and target collaboration, retire dead invites'],
 ['samples','Sample approvals','Inside the sample rules on the Samples tab'],
 ['returns','Returns inside policy','Standard returns in window, refunds under goodwill ceiling'],
 ['tagging','Creator tagging and lists','Cruva tags, groups, list building'],
];
const LEVELS=[['off','Off'],['propose','Propose'],['notify','Act, notify'],['silent','Act silently']];
const COUNTRIES={DE:'Germany',FR:'France',UK:'United Kingdom',IE:'Ireland',IT:'Italy',ES:'Spain',NL:'Netherlands'};
const CUR={EUR:'€',GBP:'£'};

function seeded(n){let s=n*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function series(seed,len,base,drift,noise){const r=seeded(seed);let v=base;const out=[];for(let i=0;i<len;i++){v=v*(1+drift)+(r()-0.5)*noise*base;out.push(Math.max(0,Math.round(v)))}return out}
function fmtMoney(v,cur='EUR'){return CUR[cur]+Math.round(v).toLocaleString('en-GB')}
function pct(v){return (Math.round(v*10)/10)+'%'}

function defaults(markets,cur){
  const weekly={};markets.forEach((m,i)=>weekly[m]=i===0?10:5);
  return {
    version:14,changed:[{v:14,who:'Elena K.',when:'3 Sep',what:'CS replies from propose to act and notify after the draft-only run.'},{v:13,who:'Sofia R.',when:'28 Aug',what:'Sample value ceiling 30 to 35.'},{v:12,who:'Elena K.',when:'21 Aug',what:'Creator outreach to act silently, 0 overrides in 14 days.'},{v:11,who:'Elena K.',when:'18 Aug',what:'September targets set.'}],
    commercials:{retainer:2500,tiers:[{upTo:50000,rate:12},{upTo:150000,rate:10},{upTo:null,rate:8}],vat:19,currency:cur,mor:false,parent:'',markets:markets.slice()},
    targets:{gmvMonthly:120000,videosWeek:30,activeCollabs:120,sampleRate:45,outreachSends:200,replyRate:12,roasFloor:2.5},
    ads:{dailyCap:200,monthlyCap:5000,roasFloor:2.5,pauseAfterDays:5,gmvMax:true,ranges:[{name:'Omega-3 range',on:true,share:50,roas:2.5},{name:'Vitamins range',on:true,share:35,roas:2.0},{name:'Minerals range',on:false,share:15,roas:2.0}]},
    pricing:{minAboveBase:10,marginFloor:28,maxDiscount:25,promoAutoRenew:true,promoMinStock:40,promoMaxDays:14,freeShipping:true,freeShipFrom:29,roundTo:'.90'},
    samples:{on:true,weekly:weekly,countries:markets.slice(),minFollowers:5000,valueCeiling:35,bundle:true,bundleWith:'Omega-3 Duo',videoWithin:14,maxPerCreator:1},
    autonomy:{listing:'silent',promo:'notify',price:'propose',ads:'notify',cs:'notify',affiliate:'propose',outreach:'silent',samples:'notify',returns:'silent',tagging:'silent'},
    guardrails:{autoRepliesDay:60,msgsPerCreatorWeek:1,blackoutFrom:'22:00',blackoutTo:'06:00',goodwill:45,stockThreshold:40,confidence:0.85},
    voice:{tone:{},language:{},banned:'heilt, garantiert, Wundermittel',escalate:'pregnancy, allergy, lawyer, press, minor'},
    routing:{am:'Elena K.',aa:'Jonas P.',va:'Mia T.',approver:'Sofia R.',slack:'',hours:'08:00–18:00 local',client:''}
  };
}

const ACCOUNTS=[];
function acct(o){
  const s=defaults(o.markets,o.cur||'EUR');
  if(o.settings) deepMerge(s,o.settings);
  s.routing.slack=s.routing.slack||('#'+o.id+'-ops');
  s.commercials.parent=s.commercials.parent||o.name;
  o.markets.forEach(m=>{s.voice.tone[m]=s.voice.tone[m]||(m==='FR'?'polite, vous':m==='DE'?'warm, du-form':'friendly, plain');s.voice.language[m]=s.voice.language[m]||(m==='DE'?'German':m==='FR'?'French':m==='IT'?'Italian':m==='ES'?'Spanish':m==='NL'?'Dutch':'English')});
  const a=Object.assign({cur:'EUR',readOnly:false,signed:null,overrides14:3,actions14:120,escalation:14,minutes:7,waitingExtra:[],findings:[],actions:[],checks:{},adsProposals:[],sampleRequests:[],priceRequests:[],runEnd:'06:12',handled:{}},o,{settings:s});
  ACCOUNTS.push(a);return a;
}
function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])){t[k]=t[k]||{};deepMerge(t[k],s[k])}else t[k]=s[k]}return t}

const okChecks=(names)=>names.map(n=>({n,st:'ok'}));
const CHECKS_BASE={
 'Homepage':['GMV, orders, visitors vs yesterday','Orders to ship, total and urgent','Pending returns','Unread customer messages','Low stock and out of stock','Negative reviews','Account health banner'],

});
const A=Object.fromEntries(ACCOUNTS.map(a=>[a.id,a]));

// ---------- derivations: the settings decide what the agent did ----------
function deriveAds(a){
 const s=a.settings.ads;const out=[];let total=a.adsProposals.reduce((t,p)=>t+p.current,0);
 for(const p of a.adsProposals){
  const range=s.ranges.find(r=>r.name===p.range);
  const floor=range?range.roas:s.roasFloor;
  if(p.proposed===0||p.roas<floor){out.push({...p,kind:'auto',what:`Paused “${p.campaign}”: ROAS ${p.roas} under the ${floor} floor for ${s.pauseAfterDays}+ days. ${fmtMoney(p.current,a.cur)}/day released.`});total-=p.current;continue}
  if(range&&!range.on){out.push({...p,kind:'blocked',what:`Held “${p.campaign}”: the ${p.range} is switched off in Ads settings.`});continue}
  const room=s.dailyCap-(total-p.current);
  if(p.proposed<=room){out.push({...p,kind:'auto',what:`Raised “${p.campaign}” from ${fmtMoney(p.current,a.cur)} to ${fmtMoney(p.proposed,a.cur)}/day. ${p.why} Total ${fmtMoney(total-p.current+p.proposed,a.cur)} inside the ${fmtMoney(s.dailyCap,a.cur)} cap.`});total=total-p.current+p.proposed}
  else{const upTo=Math.max(p.current,room);out.push({...p,kind:'wait',upTo,what:`Raise “${p.campaign}” from ${fmtMoney(upTo,a.cur)} to ${fmtMoney(p.proposed,a.cur)}/day`,why:`${p.why} ${upTo>p.current?'Rebalanced up to the cap already at '+fmtMoney(upTo,a.cur)+'; ':''}${fmtMoney(p.proposed,a.cur)} takes the account over its ${fmtMoney(s.dailyCap,a.cur)} daily cap and needs you.`});total=upTo+(total-p.current)}
 }
 return out;
}
function deriveSamples(a){
 const s=a.settings.samples;const used={};const out=[];
 for(const q of a.sampleRequests){
  if(!s.on){out.push({...q,kind:'blocked',why:'Sample approvals are off for this account.'});continue}
  if(!s.countries.includes(q.country)){out.push({...q,kind:'declined',why:`${COUNTRIES[q.country]||q.country} is not an enabled sample country.`});continue}
  if(q.followers<s.minFollowers){out.push({...q,kind:'declined',why:`${q.followers.toLocaleString('en-GB')} followers, under the ${s.minFollowers.toLocaleString('en-GB')} minimum.`});continue}
  if(q.value>s.valueCeiling){out.push({...q,kind:'wait',why:`Sample value ${fmtMoney(q.value,a.cur)} is over the ${fmtMoney(s.valueCeiling,a.cur)} ceiling. Needs you.`});continue}
  used[q.country]=(used[q.country]||0)+1;
  const quota=s.weekly[q.country]||0;
  if(used[q.country]>quota){out.push({...q,kind:'held',why:`${q.country} weekly quota of ${quota} reached. Held for next week.`});continue}
  out.push({...q,kind:'approved',why:`${q.country} ${used[q.country]} of ${quota} this week${s.bundle&&s.bundleWith?', shipped together with '+s.bundleWith:''}. Video expected within ${s.videoWithin} days.`});
 }
 return out;
}
function derivePrices(a){
 const s=a.settings.pricing;const out=[];
 for(const p of a.priceRequests){
  const minPrice=p.base*(1+s.minAboveBase/100);
  const margin=(p.requested-p.base)/p.requested*100;
  const discount=(1-p.requested/p.current)*100;
  const reasons=[];
  if(p.requested<minPrice)reasons.push(`under the minimum price of ${fmtMoney2(minPrice,a.cur)} (base + ${s.minAboveBase}%)`);
  if(margin<s.marginFloor)reasons.push(`margin ${pct(margin)} against the ${s.marginFloor}% floor`);
  if(discount>s.maxDiscount)reasons.push(`discount ${pct(discount)} over the ${s.maxDiscount}% ceiling`);
  const okPrice=Math.max(minPrice,p.base/(1-s.marginFloor/100),p.current*(1-s.maxDiscount/100));
  out.push({...p,margin,discount,minPrice,reasons,okPrice,kind:reasons.length?'wait':'auto'});
 }
 return out;
}
function fmtMoney2(v,cur){return CUR[cur]+v.toFixed(2)}

function waitingItems(a){
 const items=[];
 deriveAds(a).filter(x=>x.kind==='wait').forEach(x=>items.push({id:a.id+'-ads-'+x.campaign,cat:'money',catName:'Money out beyond cap',area:'Ads · '+x.range,t:x.what,d:x.why,btns:[`Raise to ${fmtMoney(x.proposed,a.cur)}`,'Hold at cap','Decline'],sec:'Marketing'}));
 derivePrices(a).filter(x=>x.kind==='wait').forEach(x=>items.push({id:a.id+'-price-'+x.sku,cat:'price',catName:'Price and margin',area:'Products · Pricing',t:`${x.sku}: ${fmtMoney2(x.current,a.cur)} to ${fmtMoney2(x.requested,a.cur)} blocked, ${x.reasons.join(', ')}`,d:`${x.source}. The executor refused the price. ${fmtMoney2(x.okPrice,a.cur)} is the lowest price that passes every rule; counter-offer drafted.`,btns:[`Counter at ${fmtMoney2(x.okPrice,a.cur)}`,'Override rules','Decline'],sec:'Products'}));
 deriveSamples(a).filter(x=>x.kind==='wait').forEach(x=>items.push({id:a.id+'-sample-'+x.creator,cat:'money',catName:'Money out beyond cap',area:'Samples · '+x.country,t:`Sample for ${x.creator} (${x.followers.toLocaleString('en-GB')} followers), ${x.sku} at ${fmtMoney(x.value,a.cur)}`,d:x.why,btns:['Approve','Decline'],sec:'Affiliate'}));
 a.waitingExtra.forEach(x=>items.push({...x,sec:x.sec||'CS, returns, aftercare'}));
 return items.map(x=>({...x,done:!!a.handled[x.id]}));
}
function autoActions(a){
 const out=a.actions.slice();
 deriveAds(a).filter(x=>x.kind==='auto').forEach(x=>out.push({t:'06:05',f:'ads',a:x.what,g:`Cap ${fmtMoney(a.settings.ads.dailyCap,a.cur)}/day · ROAS floor per range`,r:'Done'}));
 derivePrices(a).filter(x=>x.kind==='auto').forEach(x=>out.push({t:'06:05',f:'price',a:`Set ${x.sku} to ${fmtMoney2(x.requested,a.cur)}. ${x.source}.`,g:`Margin ${pct(x.margin)} ≥ ${a.settings.pricing.marginFloor}% · min price ${fmtMoney2(x.minPrice,a.cur)}`,r:'Live'}));
 const sm=deriveSamples(a);const ap=sm.filter(x=>x.kind==='approved');const de=sm.filter(x=>x.kind==='declined');const he=sm.filter(x=>x.kind==='held');
 if(ap.length||de.length||he.length){const by={};ap.forEach(x=>by[x.country]=(by[x.country]||0)+1);out.push({t:'06:09',f:'samples',a:`Approved ${ap.length} sample requests (${Object.entries(by).map(([k,v])=>k+' '+v).join(', ')||'none'})${a.settings.samples.bundle&&a.settings.samples.bundleWith&&ap.length?', each shipped together with '+a.settings.samples.bundleWith:''}. Declined ${de.length}, held ${he.length} for next week.`,g:`Weekly quota ${Object.entries(a.settings.samples.weekly).map(([k,v])=>k+' '+v).join(', ')} · value ≤ ${fmtMoney(a.settings.samples.valueCeiling,a.cur)} · ≥ ${a.settings.samples.minFollowers.toLocaleString('en-GB')} followers`,r:'Done'})}
 return out.sort((x,y)=>x.t.localeCompare(y.t));
}
function sectionStatus(a,sec){const cs=a.checks[sec];const w=waitingItems(a).some(x=>x.sec===sec&&!x.done);if(cs.some(c=>c.st==='crit'))return 'crit';if(w||cs.some(c=>c.st==='warn'))return 'warn';if(cs.every(c=>c.st==='na'||c.st==='ro'))return 'off';return 'ok'}
function accountStatus(a){const ss=SECTIONS.map(s=>sectionStatus(a,s));if(ss.includes('crit'))return 'crit';if(ss.includes('warn'))return 'warn';return 'ok'}
function overrideRate(a){return a.actions14?a.overrides14/a.actions14*100:0}
function allAlerts(){
 const out=[];
 for(const a of ACCOUNTS){
  for(const sec of SECTIONS)for(const c of a.checks[sec]){if(c.st==='warn'||c.st==='crit')out.push({acct:a,sec,sev:c.st,kind:'flag',t:c.n,d:c.msg,time:a.runEnd})}
  for(const w of waitingItems(a))out.push({acct:a,sec:w.sec,sev:'wait',kind:'waiting',t:w.t,d:w.d,time:a.runEnd,done:w.done,id:w.id});
  if(a.quietDays)out.push({acct:a,sec:'Account health',sev:'crit',kind:'guard',t:`Nobody looking: 0 overrides and 0 flags for ${a.quietDays} days across every family`,d:'That is not a green tick. Check somebody is actually reading this account.',time:a.runEnd});
  if(a.readOnly)out.push({acct:a,sec:'Account health',sev:'info',kind:'info',t:'Read-only account, wave 2',d:'13 sections run as checks only, zero writes until setup is done.',time:a.runEnd});
 }
 return out;
}
</script>
<script>
// ---------- charts (inline SVG, hover layer) ----------
const CH={};let chId=0;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return m*p}
function fmtK(v){return v>=1000?(Math.round(v/100)/10)+'k':String(Math.round(v))}
function lineChart(o){
 const id='c'+(++chId);const W=o.w||600,H=o.h||200,L=44,R=o.endLabel===false?16:62,T=14,B=26;const n=o.labels.length;
 const max=niceMax(Math.max(...o.series.flatMap(s=>s.values),o.target||0)*1.05);
 const x=i=>L+(n===1?0:i*(W-L-R)/(n-1));const y=v=>T+(H-T-B)*(1-v/max);
 let g='';for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"></line><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${o.fmt?o.fmt(v):fmtK(v)}</text>`}
 const step=Math.max(1,Math.ceil(n/8));let xl='';for(let i=0;i<n;i+=step)xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(o.labels[i])}</text>`;
 let paths='';o.series.forEach(s=>{const d=s.values.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');const area=o.area?`<path d="${d} L${x(n-1).toFixed(1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="${s.color}" opacity=".1"></path>`:'';const last=s.values[n-1];paths+=`${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><circle cx="${x(n-1)}" cy="${y(last)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"></circle>`;if(o.endLabel!==false)paths+=`<text x="${x(n-1)+8}" y="${y(last)+4}" style="fill:var(--ink);font-weight:500">${o.fmt?o.fmt(last):fmtK(last)}</text>`});
 const tgt=o.target?`<line x1="${L}" x2="${W-R}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"></line><text x="${W-R}" y="${y(o.target)-4}" text-anchor="end">${esc(o.targetLabel||'target')}</text>`:'';
 CH[id]={kind:'line',o,x:Array.from({length:n},(_,i)=>x(i)),W,H,L,R};
 return `<div class="chart" data-ch="${id}" style="position:relative"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${g}${xl}${tgt}${paths}<line data-cross x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" style="display:none"></line><rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"></rect></svg><div class="tip"></div></div>`;
}
function barChart(o){
 const id='c'+(++chId);const W=o.w||600,H=o.h||200,L=44,R=16,T=14,B=26;const n=o.labels.length;
 const totals=o.labels.map((_,i)=>o.series.reduce((t,s)=>t+s.values[i],0));
 const max=niceMax(Math.max(...(o.stacked?totals:o.series.flatMap(s=>s.values)),o.target||0)*1.08);
 const bw=(W-L-R)/n;const bar=Math.min(24,bw*0.6);const y=v=>T+(H-T-B)*(1-v/max);
 let g='';for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"></line><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${o.fmt?o.fmt(v):fmtK(v)}</text>`}
 const step=Math.max(1,Math.ceil(n/10));let xl='';for(let i=0;i<n;i+=step)xl+=`<text x="${L+bw*i+bw/2}" y="${H-8}" text-anchor="middle">${esc(o.labels[i])}</text>`;
 let rects='';o.labels.forEach((lab,i)=>{let acc=0;const cx=L+bw*i+bw/2;o.series.forEach((s,si)=>{const v=s.values[i];if(!v)return;const y0=y(acc+v),y1=y(acc);const h=Math.max(0,y1-y0-(si?2:0));const tip=o.series.map(ss=>`${ss.name}: ${o.fmt?o.fmt(ss.values[i]):fmtK(ss.values[i])}`).join(' · ');rects+=`<rect data-tip="${esc(lab)} — ${esc(tip)}" x="${(cx-bar/2).toFixed(1)}" y="${y0.toFixed(1)}" width="${bar.toFixed(1)}" height="${h.toFixed(1)}" fill="${s.color}" rx="${si===o.series.length-1||!o.stacked?3:0}"></rect>`;acc+=o.stacked?v:0})});
 const tgt=o.target?`<line x1="${L}" x2="${W-R}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"></line><text x="${W-R}" y="${y(o.target)-4}" text-anchor="end">${esc(o.targetLabel||'target')}</text>`:'';
 CH[id]={kind:'bar'};
 return `<div class="chart" data-ch="${id}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${g}${xl}${tgt}${rects}</svg><div class="tip"></div></div>`;
}
function hbars(rows,color,fmt){
 const max=Math.max(...rows.map(r=>r.value));
 return `<div style="display:flex;flex-direction:column;gap:6px">${rows.map(r=>`<div style="display:grid;grid-template-columns:132px minmax(0,1fr) 56px;gap:10px;align-items:center"><span class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.label)}</span><div style="height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden"><div style="height:100%;width:${(r.value/max*100).toFixed(1)}%;background:${color};border-radius:0 3px 3px 0"></div></div><span class="num r" style="font-size:12px">${fmt?fmt(r.value):r.value}</span></div>`).join('')}</div>`;
}
function spark(vals,color){const W=72,H=20;const max=Math.max(...vals),min=Math.min(...vals);const y=v=>max===min?H/2:H-2-(v-min)/(max-min)*(H-4);const d=vals.map((v,i)=>(i?'L':'M')+(i*W/(vals.length-1)).toFixed(1)+' '+y(v).toFixed(1)).join(' ');return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5"></path><circle cx="${W}" cy="${y(vals[vals.length-1])}" r="2.5" fill="${color}"></circle></svg>`}
function bindCharts(root){
 root.querySelectorAll('.chart').forEach(el=>{
  const c=CH[el.dataset.ch];if(!c)return;const tip=el.querySelector('.tip');const svg=el.querySelector('svg');
  if(c.kind==='line'){
   const cross=svg.querySelector('[data-cross]');
   svg.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*c.W;let best=0,bd=1e9;c.x.forEach((xx,i)=>{const d=Math.abs(xx-px);if(d<bd){bd=d;best=i}});cross.setAttribute('x1',c.x[best]);cross.setAttribute('x2',c.x[best]);cross.style.display='';tip.style.display='block';tip.style.left=(c.x[best]/c.W*100)+'%';tip.style.top='22px';tip.innerHTML=`<b>${esc(c.o.labels[best])}</b> · `+c.o.series.map(s=>`${esc(s.name)} ${c.o.fmt?c.o.fmt(s.values[best]):fmtK(s.values[best])}`).join(' · ')});
   svg.addEventListener('mouseleave',()=>{cross.style.display='none';tip.style.display='none'});
  }else{
   svg.querySelectorAll('rect[data-tip]').forEach(rc=>{rc.addEventListener('mouseenter',e=>{const r=svg.getBoundingClientRect();const b=rc.getBoundingClientRect();tip.style.display='block';tip.style.left=(b.left+b.width/2-r.left)+'px';tip.style.top=(b.top-r.top)+'px';tip.textContent=rc.dataset.tip});rc.addEventListener('mouseleave',()=>tip.style.display='none')});
  }
 });
}
// analytics series per account (deterministic)
function gmvSeries(a,days){const base=a.gmv.yesterday;return series(a.name.length*7+days,days,base*0.9,0.002,0.25)}
function splitChannels(a,days){const g=gmvSeries(a,days);const r=seeded(a.name.length*3);const live=g.map((v,i)=>Math.round(v*(0.22+r()*0.16)*(a.id==='greatvita'&&i===days-1?0.36:1)));const video=g.map(v=>Math.round(v*(0.38+r()*0.12)));const shop=g.map((v,i)=>Math.max(0,v-live[i]-video[i]));return {live,video,shop}}
function dayLabels(days){const out=[];const d=new Date(2026,8,6);for(let i=days-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);out.push(x.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][x.getMonth()])}return out}
function sumSeries(list){return list.reduce((acc,s)=>acc.map((v,i)=>v+s[i]),new Array(list[0].length).fill(0))}
</script>
<script>
// ---------- state, routing, shell ----------
const S={alerts:{acct:'all',sec:'all',sev:['crit','warn','wait'],showDone:false},bulk:{tab:'ads',sel:new Set(['greatvita','lumen','nordic','hollow']),mk:'all',form:{}},an:{acct:'all',range:30},setupTab:'commercials',checksFilter:'all',todayDate:'Sun 7 Sep 2026'};

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function icon(n){const I={
 accounts:'<path d="M3 4h14v12H3z"></path><path d="M3 8h14M7 8v8"></path>',
 alerts:'<path d="M10 3l8 14H2z"></path><path d="M10 8v4M10 15h.01"></path>',
 bulk:'<path d="M4 5h12M4 10h12M4 15h12"></path><path d="M14 3l2 2-2 2M14 8l2 2-2 2M14 13l2 2-2 2"></path>',
 analytics:'<path d="M3 16h14"></path><path d="M5 13l4-5 3 3 4-6"></path>',
 check:'<path d="M3 8.5l3 3 7-7"></path>',
 ext:'<path d="M6 3H3v10h10v-3M9 3h4v4M13 3L7 9"></path>',
 x:'<path d="M4 4l8 8M12 4l-8 8"></path>'};
 const vb=n==='check'||n==='ext'||n==='x'?'0 0 16 16':'0 0 20 20';return `<svg width="16" height="16" viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`}
function renderSide(){

 const waiting=ACCOUNTS.reduce((t,a)=>t+waitingItems(a).filter(x=>!x.done).length,0);
 $('#side').innerHTML=`<div class="brand"><i></i><span>Brightform Ops</span></div>

 </nav>
 <div class="acct-list"><div class="h">Accounts · ${ACCOUNTS.length}</div>${ACCOUNTS.map(a=>`<a href="#/a/${a.id}" class="${cur===a.id?'on':''}"><span class="dot ${a.readOnly?'off':accountStatus(a)}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name)}</span><span class="mk mono">${a.markets.join(' ')}</span></a>`).join('')}</div>
 <div class="me"><span class="avatar">EK</span><div class="col" style="gap:0"><span style="font-weight:500">Elena K.</span><span class="muted" style="font-size:11.5px">Account manager</span></div></div>`;

function render(){
 const {page,p}=route();renderSide();const v=$('#view');
 if(page==='alerts')v.innerHTML=viewAlerts();
 else if(page==='bulk')v.innerHTML=viewBulk();
 else if(page==='analytics')v.innerHTML=viewAnalytics();
 else if(page==='a'&&A[p[1]])v.innerHTML=viewAccount(A[p[1]],p[2]||'today',p[3]);
 else v.innerHTML=viewPortfolio();
 bindCharts(v);window.scrollTo(0,0);$('.main').scrollTop=0;
}
window.addEventListener('hashchange',render);

// ---------- portfolio ----------
function viewPortfolio(){
 topbar(`<b>This morning</b><span class="sep">·</span><span>${S.todayDate}</span>`,`<button class="btn" onclick="go('#/alerts')">${icon('alerts')}All alerts</button><button class="btn" onclick="go('#/bulk')">Bulk actions</button>`);
 const waiting=ACCOUNTS.reduce((t,a)=>t+waitingItems(a).filter(x=>!x.done).length,0);
 const unsigned=ACCOUNTS.filter(a=>!a.signed).length;
 const quiet=ACCOUNTS.filter(a=>a.quietDays);
 const ovr=ACCOUNTS.reduce((t,a)=>t+a.overrides14,0)/Math.max(1,ACCOUNTS.reduce((t,a)=>t+a.actions14,0))*100;
 const esc_=ACCOUNTS.filter(a=>!a.readOnly).reduce((t,a)=>t+a.escalation,0)/ACCOUNTS.filter(a=>!a.readOnly).length;
 const mins=ACCOUNTS.reduce((t,a)=>t+a.minutes,0)/ACCOUNTS.length;

 return `<div class="content">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap">

   <div class="tiles"><div class="card tile"><span class="h">Ran</span><span class="big num">${ACCOUNTS.length}<span class="muted" style="font-size:13px">/${ACCOUNTS.length}</span></span></div><div class="card tile warn"><span class="h">Waiting on you</span><span class="big num">${waiting}</span></div><div class="card tile"><span class="h">Unsigned</span><span class="big num">${unsigned}</span></div><div class="card tile"><span class="h">Failed writes</span><span class="big num">0</span></div></div>
  </div>
  ${quiet.map(a=>`<div class="card note crit"><span style="color:var(--crit-ink)">${icon('alerts')}</span><div><span style="font-weight:500">${esc(a.name)} has had zero overrides and zero flags for ${a.quietDays} days across every family.</span> <span class="muted">That is not a green tick. Check somebody is actually reading it.</span></div><a href="#/a/${a.id}" style="margin-left:auto">Open account</a></div>`).join('')}
  <div class="card scroll"><table class="tbl"><thead><tr><th>Account</th><th>Markets</th><th>Run</th><th class="r">Waiting</th><th class="r">Flags</th><th>Top item</th><th class="r">Override 14d</th><th class="r">Min / day</th><th>Signed off</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="grid3">
   <div class="card" style="padding:14px 16px" ><div class="col" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span>Override rate, all accounts, 14 days</span><span class="big num" style="font-size:22px">${pct(ovr)}</span></div><span class="muted">Falling for the fourth week. Price changes still the family people change most. That family stays on propose.</span></div></div>
   <div class="card" style="padding:14px 16px"><div class="col" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span>Escalation rate on replies</span><span class="big num" style="font-size:22px">${pct(esc_)}</span></div><span class="muted">One outlier: Lumen Skincare jumped from 12% to 41% overnight and the circuit breaker paused auto-send there. Something changed at the client and nobody told the library.</span></div></div>
   <div class="card" style="padding:14px 16px"><div class="col" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span>Minutes per account per day</span><span class="big num" style="font-size:22px">${mins.toFixed(1)}</span></div><span class="muted">Team average, target under 8. ${ACCOUNTS.length} accounts at ${mins.toFixed(1)} is about ${(ACCOUNTS.length*mins/60).toFixed(1)} hours a day across the team, down from roughly 8.</span></div></div>
  </div>
 </div>`;
}

// ---------- alerts ----------
function viewAlerts(){
 topbar(`<b>Alerts</b><span class="sep">·</span><span>every account, every risk area</span>`,`<label class="toggle ${S.alerts.showDone?'on':''}" onclick="S.alerts.showDone=!S.alerts.showDone;render()"><i></i><span>Show handled</span></label>`);
 const f=S.alerts;const all=allAlerts();
 const sevOn=s=>f.sev.includes(s);
 const list=all.filter(x=>(f.acct==='all'||x.acct.id===f.acct)&&(f.sec==='all'||x.sec===f.sec)&&(x.kind==='info'?sevOn('info'):x.kind==='waiting'?sevOn('wait'):sevOn(x.sev))&&(f.showDone||!x.done));
 const order={crit:0,wait:1,warn:2,info:3};list.sort((a,b)=>(order[a.sev]-order[b.sev])||a.acct.name.localeCompare(b.acct.name));
 const counts={crit:all.filter(x=>x.sev==='crit').length,warn:all.filter(x=>x.sev==='warn').length,wait:all.filter(x=>x.kind==='waiting'&&!x.done).length,ok:ACCOUNTS.reduce((t,a)=>t+SECTIONS.reduce((tt,s)=>tt+a.checks[s].filter(c=>c.st==='ok').length,0),0)};
 const chip=(k,label,n)=>`<button class="chip ${sevOn(k)?'on':''}" onclick="toggleSev('${k}')">${label}<span class="mono">${n}</span></button>`;
 const acctsShown=f.acct==='all'?ACCOUNTS:[A[f.acct]];
 const heat=`<div class="heat" style="grid-template-columns:150px repeat(${SECTIONS.length},minmax(0,1fr))"><div></div>${SECTIONS.map(s=>`<div class="top" title="${esc(s)}">${esc(s)}</div>`).join('')}${acctsShown.map(a=>`<div class="lbl" title="${esc(a.name)}">${esc(a.name)}</div>${SECTIONS.map(s=>{const st=sectionStatus(a,s);const n=a.checks[s].filter(c=>c.st==='warn'||c.st==='crit').length+waitingItems(a).filter(x=>x.sec===s&&!x.done).length;return `<div class="cell ${a.readOnly?'na':st==='off'?'':st}" title="${esc(a.name+' · '+s)}" onclick="go('#/a/${a.id}/checks/${encodeURIComponent(s)}')">${n||(st==='ok'?'✓':'')}</div>`}).join('')}`).join('')}</div>`;
 const okRows=sevOn('ok')?acctsShown.map(a=>{const n=SECTIONS.reduce((t,s)=>t+a.checks[s].filter(c=>c.st==='ok').length,0);const tot=SECTIONS.reduce((t,s)=>t+a.checks[s].length,0);return `<tr><td class="mid"><span class="tag ok">Completed</span></td><td class="mid" style="font-weight:500">${esc(a.name)}</td><td class="mid muted">All sections</td><td class="mid">${n} of ${tot} checks passed at ${a.runEnd}. ${tot-n} flagged, waiting or not applicable.</td><td class="mid r"><a href="#/a/${a.id}/checks">Open checks</a></td></tr>`}).join(''):'';
 const rows=list.map(x=>{const tag=x.kind==='waiting'?'<span class="tag warn">Waiting on you</span>':x.kind==='guard'?'<span class="tag crit">Guard</span>':x.kind==='info'?'<span class="tag info">Info</span>':x.sev==='crit'?'<span class="tag crit">Critical</span>':'<span class="tag warn">Flag</span>';
  return `<tr style="${x.done?'opacity:.5':''}"><td class="mid">${tag}</td><td class="mid" style="font-weight:500;white-space:nowrap">${esc(x.acct.name)}</td><td class="mid muted" style="white-space:nowrap">${esc(x.sec)}</td><td><div style="font-weight:500">${esc(x.t)}</div><div class="muted">${esc(x.d||'')}</div></td><td class="mid r" style="white-space:nowrap">${x.kind==='waiting'&&!x.done?`<button class="btn sm" onclick="handle('${x.acct.id}','${esc(x.id)}','Handled')">Mark handled</button> `:''}<a href="#/a/${x.acct.id}${x.kind==='waiting'?'':'/checks/'+encodeURIComponent(x.sec)}">Open</a></td></tr>`}).join('');
 return `<div class="content">
  <div class="sec"><div class="sec-h"><span class="h">Risk areas by account</span><span class="muted">Each cell is one of the 13 sections. Number = open flags and waiting items. Click a cell to open the checks.</span></div><div class="card scroll" style="padding:14px 16px">${heat}</div></div>
  <div class="sec">
   <div class="sec-h"><span class="h">Alerts</span><span class="muted">${list.length} shown</span></div>
   <div class="card" style="padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <select onchange="S.alerts.acct=this.value;render()">${['all',...ACCOUNTS.map(a=>a.id)].map(id=>`<option value="${id}" ${f.acct===id?'selected':''}>${id==='all'?'All accounts':esc(A[id].name)}</option>`).join('')}</select>
    <select onchange="S.alerts.sec=this.value;render()"><option value="all">All risk areas</option>${SECTIONS.map(s=>`<option value="${esc(s)}" ${f.sec===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
    <div class="chips">${chip('crit','Critical',counts.crit)}${chip('wait','Waiting on you',counts.wait)}${chip('warn','Flags',counts.warn)}${chip('ok','Completed checks',counts.ok)}${chip('info','Info',ACCOUNTS.filter(a=>a.readOnly).length)}</div>
   </div>
   <div class="card scroll"><table class="tbl"><thead><tr><th>Type</th><th>Account</th><th>Area</th><th>Alert</th><th></th></tr></thead><tbody>${rows}${okRows}${!rows&&!okRows?'<tr><td colspan="5" class="empty">Nothing matches these filters.</td></tr>':''}</tbody></table></div>
  </div>
 </div>`;
}
function toggleSev(k){const s=S.alerts.sev;const i=s.indexOf(k);if(i>=0)s.splice(i,1);else s.push(k);render()}
function handle(aid,id,label){const a=A[aid];a.handled[id]=label;render();toast(label+'. Logged against '+a.name+' with the settings version it ran under.')}
</script>
<script>
// ---------- bulk actions ----------
function viewBulk(){
 const b=S.bulk;
 topbar(`<b>Bulk actions</b><span class="sep">·</span><span>apply one rule across many accounts</span>`,`<button class="btn primary" onclick="applyBulk()">Apply to ${b.sel.size} account${b.sel.size===1?'':'s'}</button>`);
 const mks=['all',...new Set(ACCOUNTS.flatMap(a=>a.markets))];
 const list=ACCOUNTS.filter(a=>b.mk==='all'||a.markets.includes(b.mk));
 const accts=`<div class="card" style="display:flex;flex-direction:column;min-height:0">
  <div style="padding:12px 14px;border-bottom:1px solid var(--border-2);display:flex;flex-direction:column;gap:10px">
   <div class="chips">${mks.map(m=>`<button class="chip ${b.mk===m?'on':''}" onclick="S.bulk.mk='${m}';render()">${m==='all'?'All markets':m}</button>`).join('')}</div>
   <div class="row" style="justify-content:space-between"><span class="muted">${b.sel.size} selected</span><span class="btn-row"><button class="btn sm" onclick="list_ids('${b.mk}').forEach(i=>S.bulk.sel.add(i));render()">Select shown</button><button class="btn sm quiet" onclick="S.bulk.sel.clear();render()">Clear</button></span></div>
  </div>
  <div style="overflow:auto;max-height:560px">${list.map(a=>`<label class="list-row" style="cursor:pointer;justify-content:flex-start;gap:10px"><input type="checkbox" ${b.sel.has(a.id)?'checked':''} ${a.readOnly?'disabled':''} onchange="this.checked?S.bulk.sel.add('${a.id}'):S.bulk.sel.delete('${a.id}');render()"><span style="flex:1;${a.readOnly?'color:var(--faint)':''}">${esc(a.name)}</span><span class="mono muted" style="font-size:11px">${a.markets.join(' ')}</span><span class="mono muted" style="font-size:11px;width:78px;text-align:right">${b.tab==='ads'?fmtMoney(a.settings.ads.dailyCap,a.cur)+'/d':b.tab==='samples'?Object.values(a.settings.samples.weekly).reduce((t,v)=>t+v,0)+'/wk':a.settings.pricing.minAboveBase+'% · '+a.settings.pricing.marginFloor+'%'}</span></label>`).join('')}</div></div>`;
 const F=b.form;const fi=(label,key,type='number',hint='',unit='')=>`<div class="field"><label>${label}</label><div class="unit">${type==='select'?`<select onchange="S.bulk.form['${key}']=this.value;render()"><option value="">Keep as is</option>${hint.split('|').map(o=>`<option value="${o}" ${F[key]===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input type="${type}" placeholder="keep as is" value="${F[key]??''}" onchange="S.bulk.form['${key}']=this.value===''?undefined:this.value;render()">`}${unit?`<span>${unit}</span>`:''}</div>${type!=='select'&&hint?`<span class="hint">${hint}</span>`:''}</div>`;
 let form='',preview='';
 const selA=[...b.sel].map(i=>A[i]).filter(Boolean);
 if(b.tab==='ads'){
  const ranges=[...new Set(selA.flatMap(a=>a.settings.ads.ranges.map(r=>r.name)))];
  form=`<div class="field-grid">${fi('Daily spend cap','dailyCap','number','The agent rebalances up to this; anything above waits for a person.','per day')}${fi('Monthly spend cap','monthlyCap','number','','per month')}${fi('ROAS floor','roasFloor','number','Campaigns under this are paused after the grace days.','× ROAS')}${fi('Grace days under floor','pauseAfterDays','number','')}${fi('GMV Max auto-optimise','gmvMax','select','on|off')}${fi('Product range','range','select',ranges.join('|'))}${F.range?fi('Range on','rangeOn','select','on|off'):''}${F.range?fi('Range ROAS target','rangeRoas','number','','× ROAS'):''}${F.range?fi('Range share of budget','rangeShare','number','','%'):''}</div>`;
  preview=`<table class="tbl"><thead><tr><th>Account</th><th class="r">Cap now</th><th class="r">Cap after</th><th>Tomorrow’s run</th></tr></thead><tbody>${selA.map(a=>{const cap=F.dailyCap?+F.dailyCap:a.settings.ads.dailyCap;const sim=deriveAds(simulate(a,{ads:{dailyCap:cap,roasFloor:F.roasFloor?+F.roasFloor:undefined}}));const w=sim.filter(x=>x.kind==='wait').length,au=sim.filter(x=>x.kind==='auto').length;return `<tr><td class="mid" style="font-weight:500">${esc(a.name)}</td><td class="mid r mono">${fmtMoney(a.settings.ads.dailyCap,a.cur)}</td><td class="mid r mono" style="${cap!==a.settings.ads.dailyCap?'font-weight:500':''}">${fmtMoney(cap,a.cur)}</td><td class="mid muted">${sim.length?`${au} automatic, ${w} waiting for a person`:'No ads proposals pending'}</td></tr>`}).join('')}</tbody></table>`;
 }else if(b.tab==='samples'){
  const cs=Object.keys(COUNTRIES);
  form=`<div class="col" style="gap:14px"><div><div class="h" style="margin-bottom:8px">How many to accept per week, per country</div><div class="field-grid">${cs.map(c=>fi(COUNTRIES[c],'wk_'+c,'number','','/ week')).join('')}</div></div>
  <div class="field-grid">${fi('Countries enabled','countries','select','keep|only the accounts’ own markets|all of the above')}${fi('Minimum followers','minFollowers','number','Requests under this are declined automatically.')}${fi('Sample value ceiling','valueCeiling','number','Above this the request waits for a person.')}${fi('Ship samples together','bundle','select','on|off')}${fi('Bundle with','bundleWith','text','SKU added to every sample parcel, e.g. a mini or a shaker')}${fi('Video expected within','videoWithin','number','The chase rule fires after this.','days')}</div></div>`;
  preview=`<table class="tbl"><thead><tr><th>Account</th><th>Quota now</th><th>Quota after</th><th>Pending requests tomorrow</th></tr></thead><tbody>${selA.map(a=>{const wk={...a.settings.samples.weekly};cs.forEach(c=>{if(F['wk_'+c]!==undefined&&(a.markets.includes(c)||F.countries==='all of the above'))wk[c]=+F['wk_'+c]});const sim=deriveSamples(simulate(a,{samples:{weekly:wk,minFollowers:F.minFollowers?+F.minFollowers:undefined,valueCeiling:F.valueCeiling?+F.valueCeiling:undefined,countries:F.countries==='all of the above'?cs:undefined}}));const k=x=>sim.filter(s=>s.kind===x).length;return `<tr><td class="mid" style="font-weight:500">${esc(a.name)}</td><td class="mid mono muted">${Object.entries(a.settings.samples.weekly).map(([c,v])=>c+' '+v).join(' · ')}</td><td class="mid mono">${Object.entries(wk).map(([c,v])=>c+' '+v).join(' · ')}</td><td class="mid muted">${sim.length?`${k('approved')} approved, ${k('held')} held, ${k('declined')} declined, ${k('wait')} waiting`:'None pending'}</td></tr>`}).join('')}</tbody></table>`;
 }else{
  form=`<div class="field-grid">${fi('Minimum price above base','minAboveBase','number','Sell price never under base cost plus this.','%')}${fi('Margin floor','marginFloor','number','','%')}${fi('Max discount','maxDiscount','number','','%')}${fi('Round prices to','roundTo','select','.90|.99|.00')}${fi('Renew expiring promos at same terms','promoAutoRenew','select','on|off')}${fi('Do not renew under stock of','promoMinStock','number','','units')}${fi('Max promo length','promoMaxDays','number','','days')}${fi('Free shipping','freeShipping','select','on|off')}${fi('Free shipping from','freeShipFrom','number','','order value')}</div>`;
  preview=`<table class="tbl"><thead><tr><th>Account</th><th>Rules now</th><th>Rules after</th><th>Pending price changes tomorrow</th></tr></thead><tbody>${selA.map(a=>{const p=a.settings.pricing;const np={minAboveBase:F.minAboveBase?+F.minAboveBase:p.minAboveBase,marginFloor:F.marginFloor?+F.marginFloor:p.marginFloor,maxDiscount:F.maxDiscount?+F.maxDiscount:p.maxDiscount};const sim=derivePrices(simulate(a,{pricing:np}));return `<tr><td class="mid" style="font-weight:500">${esc(a.name)}</td><td class="mid mono muted">+${p.minAboveBase}% · ${p.marginFloor}% · ≤${p.maxDiscount}% · ship ${p.freeShipping?'free from '+fmtMoney(p.freeShipFrom,a.cur):'paid'}</td><td class="mid mono">+${np.minAboveBase}% · ${np.marginFloor}% · ≤${np.maxDiscount}% · ship ${(F.freeShipping?F.freeShipping==='on':p.freeShipping)?'free from '+fmtMoney(F.freeShipFrom?+F.freeShipFrom:p.freeShipFrom,a.cur):'paid'}</td><td class="mid muted">${sim.length?`${sim.filter(x=>x.kind==='auto').length} apply automatically, ${sim.filter(x=>x.kind==='wait').length} blocked and waiting`:'None pending'}</td></tr>`}).join('')}</tbody></table>`;
 }
 return `<div class="content">
  <div class="tabs" style="margin:-20px -24px 0;padding-left:24px"><a href="#/bulk" class="${b.tab==='ads'?'on':''}" onclick="S.bulk.tab='ads';S.bulk.form={};render();return false">Ad budgets and ROAS</a><a href="#/bulk" class="${b.tab==='samples'?'on':''}" onclick="S.bulk.tab='samples';S.bulk.form={};render();return false">Samples</a><a href="#/bulk" class="${b.tab==='pricing'?'on':''}" onclick="S.bulk.tab='pricing';S.bulk.form={};render();return false">Pricing and promos</a></div>
  <div style="display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start">
   ${accts}
   <div class="col" style="gap:20px">
    <div class="card" style="padding:16px 18px"><div class="col" style="gap:14px"><div class="sec-h"><span class="h" style="color:var(--ink)">Rule to apply</span><span class="muted">Blank fields keep each account’s own value. Each account gets a new settings version.</span></div>${form}</div></div>
    <div class="sec"><div class="sec-h"><span class="h">What changes tomorrow</span><span class="muted">Simulated against each account’s pending items with the rule above.</span></div><div class="card scroll">${selA.length?preview:'<div class="empty">Select accounts on the left.</div>'}</div></div>
