  </div>
 </div>`;
}
function list_ids(mk){return ACCOUNTS.filter(a=>!a.readOnly&&(mk==='all'||a.markets.includes(mk))).map(a=>a.id)}
function simulate(a,patch){const s=JSON.parse(JSON.stringify(a.settings));for(const k in patch){for(const kk in patch[k]){if(patch[k][kk]!==undefined)s[k][kk]=patch[k][kk]}}if(patch.ads&&patch.ads.roasFloor!==undefined)s.ads.ranges.forEach(r=>r.roas=patch.ads.roasFloor);return {...a,settings:s}}
function applyBulk(){
 const b=S.bulk,F=b.form;const sel=[...b.sel].map(i=>A[i]).filter(Boolean);if(!sel.length){toast('Select at least one account.');return}
 const changes=[];
 sel.forEach(a=>{const s=a.settings;
  if(b.tab==='ads'){if(F.dailyCap){s.ads.dailyCap=+F.dailyCap;changes.push('daily cap')}if(F.monthlyCap)s.ads.monthlyCap=+F.monthlyCap;if(F.roasFloor){s.ads.roasFloor=+F.roasFloor;s.ads.ranges.forEach(r=>r.roas=+F.roasFloor);changes.push('ROAS floor')}if(F.pauseAfterDays)s.ads.pauseAfterDays=+F.pauseAfterDays;if(F.gmvMax)s.ads.gmvMax=F.gmvMax==='on';if(F.range){const r=s.ads.ranges.find(x=>x.name===F.range);if(r){if(F.rangeOn)r.on=F.rangeOn==='on';if(F.rangeRoas)r.roas=+F.rangeRoas;if(F.rangeShare)r.share=+F.rangeShare;changes.push('range '+F.range)}}}
  else if(b.tab==='samples'){Object.keys(COUNTRIES).forEach(c=>{if(F['wk_'+c]!==undefined&&(a.markets.includes(c)||F.countries==='all of the above')){s.samples.weekly[c]=+F['wk_'+c];if(!s.samples.countries.includes(c))s.samples.countries.push(c);changes.push('quota '+c)}});if(F.countries==='all of the above')s.samples.countries=Object.keys(COUNTRIES);if(F.countries==='only the accounts’ own markets')s.samples.countries=a.markets.slice();if(F.minFollowers)s.samples.minFollowers=+F.minFollowers;if(F.valueCeiling)s.samples.valueCeiling=+F.valueCeiling;if(F.bundle)s.samples.bundle=F.bundle==='on';if(F.bundleWith)s.samples.bundleWith=F.bundleWith;if(F.videoWithin)s.samples.videoWithin=+F.videoWithin}
  else{const p=s.pricing;if(F.minAboveBase)p.minAboveBase=+F.minAboveBase;if(F.marginFloor)p.marginFloor=+F.marginFloor;if(F.maxDiscount)p.maxDiscount=+F.maxDiscount;if(F.roundTo)p.roundTo=F.roundTo;if(F.promoAutoRenew)p.promoAutoRenew=F.promoAutoRenew==='on';if(F.promoMinStock)p.promoMinStock=+F.promoMinStock;if(F.promoMaxDays)p.promoMaxDays=+F.promoMaxDays;if(F.freeShipping)p.freeShipping=F.freeShipping==='on';if(F.freeShipFrom)p.freeShipFrom=+F.freeShipFrom}
  s.version++;s.changed.unshift({v:s.version,who:'Elena K.',when:'7 Sep',what:'Bulk action: '+{ads:'ad budgets and ROAS',samples:'sample rules',pricing:'pricing and promos'}[b.tab]+'.'});
 });
 b.form={};render();toast(`Applied to ${sel.length} account${sel.length===1?'':'s'}. Each got a new settings version; tomorrow’s 06:00 run uses it.`);
}

// ---------- analytics ----------
function viewAnalytics(){
 const an=S.an;const accts=an.acct==='all'?ACCOUNTS.filter(a=>!a.readOnly):[A[an.acct]];const days=an.range;const labels=dayLabels(days);
 topbar(`<b>Analytics</b><span class="sep">·</span><span>${an.acct==='all'?'all accounts':esc(A[an.acct].name)}</span>`,`<select onchange="S.an.acct=this.value;render()"><option value="all">All accounts</option>${ACCOUNTS.map(a=>`<option value="${a.id}" ${an.acct===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select><span class="seg">${[7,30,90].map(d=>`<button class="${an.range===d?'on':''}" onclick="S.an.range=${d};render()">${d}d</button>`).join('')}</span>`);
 const cur=an.acct==='all'?'EUR':A[an.acct].cur;const fm=v=>fmtMoney(v,cur);
 const gmv=sumSeries(accts.map(a=>gmvSeries(a,days)));
 const ch=accts.map(a=>splitChannels(a,days));const live=sumSeries(ch.map(c=>c.live)),video=sumSeries(ch.map(c=>c.video)),shop=sumSeries(ch.map(c=>c.shop));
 const paid=gmv.map((v,i)=>Math.round(v*(0.28+0.1*Math.sin(i/5))));const organic=gmv.map((v,i)=>v-paid[i]);
 const total=gmv.reduce((t,v)=>t+v,0);const prevTotal=Math.round(total*0.93);
 const target=accts.reduce((t,a)=>t+a.settings.targets.gmvMonthly,0)*days/30;
 const weekLabels=['w31','w32','w33','w34','w35','w36'];
 const videos=accts.length===1?series(accts[0].name.length,6,accts[0].settings.targets.videosWeek*0.9,0.01,0.3):series(5,6,accts.reduce((t,a)=>t+a.settings.targets.videosWeek,0)*0.9,0.01,0.15);
 const vTarget=accts.reduce((t,a)=>t+a.settings.targets.videosWeek,0);
 const ovr=[7.4,6.1,5.2,4.6,3.4,accts.length===1?overrideRate(accts[0]):2.7].map(v=>Math.round(v*10)/10);
 const escl=[24,21,19,17,15,accts.length===1?accts[0].escalation:14];
 const mins=[26,22,18,14,11,accts.length===1?accts[0].minutes:7.4];
 const bucket=(arr,size)=>{const out=[];for(let i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size).reduce((t,v)=>t+v,0));return out};
 const bsize=days===90?7:days===30?2:1;const bl=days===90?labels.filter((_,i)=>i%7===0).map(l=>'wk '+l):days===30?labels.filter((_,i)=>i%2===0):labels;
 const funnelCountries=[...new Set(accts.flatMap(a=>a.markets))].slice(0,4);
 const funnel=c=>{const r=seeded(c.charCodeAt(0)*31+c.charCodeAt(1));const o=Math.round(400+r()*600);const req=Math.round(o*(0.18+r()*0.1));const ap=Math.round(req*(0.6+r()*0.2));const de=Math.round(ap*(c==='NL'?0.38:0.7+r()*0.2));const vi=Math.round(de*(c==='DE'?0.31:0.4+r()*0.2));return [{label:'Outreach sent',value:o},{label:'Sample requested',value:req},{label:'Approved',value:ap},{label:'Delivered',value:de},{label:'Video posted',value:vi}]};
 const tbl=ACCOUNTS.filter(a=>!a.readOnly).map(a=>{const t=a.settings.targets.gmvMonthly;const pace=t?a.gmv.month/(t*7/30)*100:null;return `<tr class="click" onclick="S.an.acct='${a.id}';render()"><td class="mid" style="font-weight:500">${esc(a.name)}</td><td class="mid r mono">${fmtMoney(a.gmv.month,a.cur)}</td><td class="mid r mono">${t?fmtMoney(t,a.cur):'<span class="muted">no target</span>'}</td><td class="mid r mono" style="${pace===null?'':pace<90?'color:var(--crit-ink)':pace>110?'color:var(--good-ink)':''}">${pace===null?'–':pct(pace)}</td><td class="mid">${spark(gmvSeries(a,14),'var(--s1)')}</td><td class="mid r mono">${a.escalation}%</td><td class="mid r mono">${pct(overrideRate(a))}</td><td class="mid r mono">${a.minutes}</td></tr>`}).join('');
 return `<div class="content">
  <div class="tiles"><div class="card tile"><span class="h">GMV, ${days} days</span><span class="big num">${fm(total)}</span><span class="muted">${total>=prevTotal?'+':''}${pct((total/prevTotal-1)*100)} vs prior ${days} days</span></div><div class="card tile"><span class="h">Pace vs target</span><span class="big num">${target?pct(total/target*100):'–'}</span><span class="muted">${target?fm(target)+' expected by now':'no targets set'}</span></div><div class="card tile"><span class="h">Paid share of GMV</span><span class="big num">${pct(paid.reduce((t,v)=>t+v,0)/total*100)}</span><span class="muted">dependence on paid, trend flat</span></div><div class="card tile"><span class="h">Affiliate videos, this week</span><span class="big num">${videos[5]}<span class="muted" style="font-size:13px">/${vTarget||'–'}</span></span><span class="muted">${vTarget?(videos[5]>=vTarget?'on target':'under target'):'no target'}</span></div></div>
  <div class="grid2" style="grid-template-columns:minmax(0,3fr) minmax(0,2fr)">
   <div class="card" style="padding:16px 18px"><div class="sec-h" style="margin-bottom:10px"><span class="h" style="color:var(--ink)">GMV per day</span><span class="muted">dashed line: target pace per day</span></div>${lineChart({labels,series:[{name:'GMV',color:'var(--s1)',values:gmv}],fmt:fm,area:true,target:target?Math.round(target/days):0,targetLabel:'target/day',h:220})}</div>
   <div class="card" style="padding:16px 18px"><div class="sec-h" style="margin-bottom:10px"><span class="h" style="color:var(--ink)">GMV by content type</span><div class="legend"><span><i style="background:var(--s1)"></i>LIVE</span><span><i style="background:var(--s2)"></i>Video</span><span><i style="background:var(--s3)"></i>Shop page</span></div></div>${barChart({labels:bl,stacked:true,series:[{name:'LIVE',color:'var(--s1)',values:bucket(live,bsize)},{name:'Video',color:'var(--s2)',values:bucket(video,bsize)},{name:'Shop page',color:'var(--s3)',values:bucket(shop,bsize)}],fmt:fm,h:220})}</div>
  </div>
  <div class="grid2" style="grid-template-columns:minmax(0,2fr) minmax(0,3fr)">
   <div class="card" style="padding:16px 18px"><div class="sec-h" style="margin-bottom:10px"><span class="h" style="color:var(--ink)">Paid vs organic GMV</span><div class="legend"><span><i style="background:var(--s2)"></i>Paid</span><span><i style="background:var(--s1)"></i>Organic</span></div></div>${lineChart({labels,series:[{name:'Organic',color:'var(--s1)',values:organic},{name:'Paid',color:'var(--s2)',values:paid}],fmt:fm,h:200})}</div>
   <div class="card" style="padding:16px 18px"><div class="sec-h" style="margin-bottom:10px"><span class="h" style="color:var(--ink)">Sample funnel per country, ${days} days</span><span class="muted">where the leak is, per stage</span></div><div class="grid2" style="grid-template-columns:repeat(${Math.min(2,funnelCountries.length)},minmax(0,1fr));gap:18px">${funnelCountries.map(c=>`<div class="col" style="gap:8px"><span style="font-weight:500">${COUNTRIES[c]||c}</span>${hbars(funnel(c),'var(--s1)')}</div>`).join('')}</div></div>
  </div>
  <div class="grid4">
   <div class="card" style="padding:16px 18px"><div class="h" style="margin-bottom:10px">Affiliate videos per week</div>${barChart({labels:weekLabels,series:[{name:'Videos',color:'var(--s1)',values:videos}],target:vTarget,targetLabel:'target',h:150,w:300})}</div>
   <div class="card" style="padding:16px 18px"><div class="h" style="margin-bottom:10px">Override rate, weekly</div>${lineChart({labels:weekLabels,series:[{name:'Override',color:'var(--s1)',values:ovr}],fmt:v=>pct(v),h:150,w:300})}</div>
   <div class="card" style="padding:16px 18px"><div class="h" style="margin-bottom:10px">Escalation rate on replies</div>${lineChart({labels:weekLabels,series:[{name:'Escalation',color:'var(--s1)',values:escl}],fmt:v=>pct(v),h:150,w:300})}</div>
   <div class="card" style="padding:16px 18px"><div class="h" style="margin-bottom:10px">Minutes per account per day</div>${lineChart({labels:weekLabels,series:[{name:'Minutes',color:'var(--s1)',values:mins}],fmt:v=>String(Math.round(v*10)/10),target:8,targetLabel:'target 8',h:150,w:300})}</div>
  </div>
  <div class="sec"><div class="sec-h"><span class="h">Accounts against target, September</span><span class="muted">Click a row to focus the charts on that account.</span></div><div class="card scroll"><table class="tbl"><thead><tr><th>Account</th><th class="r">GMV month to date</th><th class="r">Monthly target</th><th class="r">Pace</th><th>14 days</th><th class="r">Escalation</th><th class="r">Override 14d</th><th class="r">Min / day</th></tr></thead><tbody>${tbl}</tbody></table></div></div>
 </div>`;
}
</script>
<script>
// ---------- account ----------
function famName(k){const f=FAMILIES.find(x=>x[0]===k);return f?f[1]:k==='orders'?'Orders':k}
function viewAccount(a,tab,sub){
 const wait=waitingItems(a);const open=wait.filter(x=>!x.done).length;
 topbar(`<a href="#/accounts">Accounts</a><span class="sep">/</span><b>${esc(a.name)}</b>${a.markets.map(m=>`<span class="tag neutral mono">${m}</span>`).join('')}<span class="sep">·</span><span class="tag neutral mono">settings v${a.settings.version}</span>${a.readOnly?'<span class="tag info">Read-only, wave 2</span>':''}`,
  `${a.signed?`<span class="row" style="color:var(--good-ink)">${icon('check')}Signed off ${a.signed}</span>`:''}<button class="btn" onclick="go('#/analytics');S.an.acct='${a.id}';render()">Analytics</button><button class="btn primary" onclick="openSignoff('${a.id}')">${icon('check')}Sign off and share</button>`);
 const tabs=`<div class="tabs">${[['today','Today'],['checks','Checks'],['setup','Setup']].map(([k,l])=>`<a href="#/a/${a.id}/${k}" class="${tab===k?'on':''}">${l}${k==='today'&&open?` <span class="tag warn" style="height:18px;padding:0 6px;margin-left:4px">${open}</span>`:''}</a>`).join('')}</div>`;
 return tabs+(tab==='checks'?viewChecks(a,sub):tab==='setup'?viewSetup(a,sub):viewToday(a));
}
function viewToday(a){
 const wait=waitingItems(a);const open=wait.filter(x=>!x.done);const acts=autoActions(a);
 const flags=SECTIONS.reduce((t,s)=>t+a.checks[s].filter(c=>c.st==='warn'||c.st==='crit').length,0);
 const items=wait.map(x=>`<div class="item ${x.done?'done':''}"><div class="col" style="gap:6px;align-items:flex-start"><span class="tag ${x.cat}">${esc(x.catName)}</span><span class="muted">${esc(x.area)}</span></div><div class="col"><div class="t">${esc(x.t)}</div><div class="muted">${esc(x.d)}</div></div><div class="btn-row" style="align-items:flex-start">${x.done?`<span class="tag ok">${esc(a.handled[x.id])}</span>`:x.btns.map((b,i)=>`<button class="btn ${i===0?'primary':i===x.btns.length-1?'quiet':''}" onclick="handle('${a.id}','${esc(x.id)}','${esc(b)}')">${esc(b)}</button>`).join('')}</div></div>`).join('');
 const finds=a.findings.map(f=>`<div class="item"><div class="col"><span style="font-weight:500">${esc(f.k)}</span><span class="mono" style="font-size:18px;color:var(--${f.sev}-ink)">${esc(f.v)}</span><span class="muted mono">${esc(f.sub)}</span></div><div class="col"><div><span style="font-weight:500">${esc(f.t)}</span> <span class="muted">${esc(f.d)}</span></div></div><div><button class="btn" onclick="go('#/a/${a.id}/checks/${encodeURIComponent(f.sec)}')">${esc(f.sec)}</button></div></div>`).join('');
 const rows=acts.map(x=>`<tr><td class="mono muted">${x.t}</td><td>${esc(famName(x.f))}</td><td>${esc(x.a)}</td><td class="muted">${esc(x.g)}</td><td><span class="tag ${x.r==='Paused'?'warn':'ok'}">${esc(x.r)}</span></td><td><a href="#" onclick="toast('Override logged against ${esc(famName(x.f))}. Counts toward that family\\'s override rate.');return false">Override</a></td></tr>`).join('');
 const ran=SECTIONS.map(s=>{const st=sectionStatus(a,s);const cs=a.checks[s];const msg=cs.find(c=>c.st==='crit')||cs.find(c=>c.st==='warn')||cs.find(c=>c.st==='na');const w=wait.filter(x=>x.sec===s&&!x.done).length;return `<a class="list-row" href="#/a/${a.id}/checks/${encodeURIComponent(s)}" style="color:inherit;text-decoration:none"><span class="row" style="white-space:nowrap"><span class="dot ${st}"></span>${esc(s)}</span><span class="muted" style="text-align:right;font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${w?w+' waiting':msg?esc((msg.msg||'').split('.')[0]):a.readOnly?'checked, read-only':cs.length+' passed'}</span></a>`}).join('');
 const ch=a.settings.changed[0];
 return `<div class="content">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap">
   <div class="col" style="gap:6px"><div class="row"><span class="title">${esc(a.name)}</span><span class="muted">AM ${esc(a.settings.routing.am)} · Approver ${esc(a.settings.routing.approver)} · ${esc(a.settings.routing.slack)}</span></div><div class="row"><span class="dot ${a.readOnly?'off':'ok'}"></span><span>Morning run 06:00 local finished ${a.runEnd}. 13 sections, ${SECTIONS.reduce((t,s)=>t+a.checks[s].length,0)} checks. Slack summary posted ${a.runEnd.replace(/\d+$/,m=>String(+m+1).padStart(2,'0'))}.</span><span class="muted">${a.signed?'Signed off '+a.signed+'.':'Not signed off yet.'}</span></div></div>
   <div class="tiles"><div class="card tile"><span class="h">Actions</span><span class="big num">${acts.length}</span></div><div class="card tile"><span class="h">Flags</span><span class="big num">${flags}</span></div><div class="card tile ${open.length?'warn':''}"><span class="h">Waiting on you</span><span class="big num">${open.length}</span></div></div>
  </div>
  ${a.quietDays?`<div class="card note crit"><span style="color:var(--crit-ink)">${icon('alerts')}</span><div><span style="font-weight:500">Zero overrides and zero flags for ${a.quietDays} days across every family.</span> <span class="muted">That is not a green tick. Check somebody is actually reading this account.</span></div></div>`:''}
  <div class="grid2">
   <div class="col" style="gap:20px;min-width:0">
    <div class="sec"><div class="sec-h"><span class="h">Waiting on you</span><span class="muted">Four gate categories plus assisted items. Everything else already ran.</span></div><div class="card">${items||'<div class="empty">Nothing waiting. Everything ran inside the account’s autonomy.</div>'}</div></div>
    <div class="sec"><div class="sec-h"><span class="h">What it found</span><span class="muted">Every swing carries its cause. No cause, no line.</span></div><div class="card">${finds||'<div class="empty">No findings today.</div>'}</div></div>
    <div class="sec"><div class="sec-h"><span class="h">What changed</span><span class="muted">Executed inside autonomy and guardrails. Override anything and it counts against that family.</span></div><div class="card scroll"><table class="tbl"><thead><tr><th style="width:56px">Time</th><th style="width:150px">Family</th><th>Action</th><th style="width:220px">Guardrail passed</th><th style="width:80px">Result</th><th style="width:72px"></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">No writes. '+(a.readOnly?'Read-only account.':'')+'</td></tr>'}</tbody></table></div></div>
   </div>
   <div class="col" style="gap:20px">
    <div class="sec"><span class="h" style="color:var(--ink)">What ran</span><div class="card" style="display:flex;flex-direction:column">${ran}</div></div>
    <div class="sec"><span class="h" style="color:var(--ink)">The three numbers</span><div class="card">
     <div style="padding:14px 16px;border-bottom:1px solid var(--border-2)" class="col"><div style="display:flex;justify-content:space-between;align-items:baseline"><span>Override rate, 14 days</span><span class="big num" style="font-size:22px">${pct(overrideRate(a))}</span></div><span class="muted">${a.overrides14} of ${a.actions14} actions changed by a person. ${overrideRate(a)>10?'Rising on price changes, that family goes back to propose.':overrideRate(a)>0?'Falling. Trust is being earned.':'Zero. Make sure that means trust, not absence.'}</span></div>
     <div style="padding:14px 16px;border-bottom:1px solid var(--border-2)" class="col"><div style="display:flex;justify-content:space-between;align-items:baseline"><span>Escalation rate on replies</span><span class="big num" style="font-size:22px">${a.escalation}%</span></div><span class="muted">${a.escalation>30?'Above the normal band. Circuit breaker paused auto-send until the library is updated.':'Falling as the library fills. Gaps this week become suggested entries on the Voice and knowledge tab.'}</span></div>
     <div style="padding:14px 16px" class="col"><div style="display:flex;justify-content:space-between;align-items:baseline"><span>Minutes on this account, per day</span><span class="big num" style="font-size:22px">${a.minutes}</span></div><span class="muted">Target under 8.</span></div>
    </div></div>
    <div class="card" style="padding:14px 16px" ><div class="col" style="gap:6px"><span class="h">Run record</span><div class="muted col" style="gap:4px"><div style="display:flex;justify-content:space-between"><span>Snapshot</span><span class="mono">2026-09-07 06:00:41</span></div><div style="display:flex;justify-content:space-between"><span>Settings version</span><span class="mono">v${a.settings.version} (${esc(ch.who.split(' ')[0])}, ${esc(ch.when)})</span></div><div style="display:flex;justify-content:space-between"><span>Sources synced</span><span class="mono">9 of 9</span></div><div style="display:flex;justify-content:space-between"><span>Writes</span><span class="mono">${a.readOnly?'0 (read-only)':acts.length+' ok · 0 failed'}</span></div><div style="display:flex;justify-content:space-between"><span>Audit log</span><a href="#" onclick="toast('Audit log: every action with evidence, settings version, guardrails passed and result.');return false">Open</a></div></div></div></div>
   </div>
  </div>
 </div>`;
}
function viewChecks(a,sub){
 const focus=sub?decodeURIComponent(sub):null;const f=S.checksFilter;
 const secs=SECTIONS.filter(s=>!focus||s===focus).map(s=>{const cs=a.checks[s].filter(c=>f==='all'||(f==='flags'?(c.st==='warn'||c.st==='crit'):c.st==='ok'));if(!cs.length)return '';const w=waitingItems(a).filter(x=>x.sec===s&&!x.done);
  return `<div class="sec" id="sec-${s.replace(/\W/g,'')}"><div class="sec-h"><span class="row"><span class="dot ${sectionStatus(a,s)}"></span><span class="h" style="color:var(--ink)">${esc(s)}</span></span><span class="muted">${a.checks[s].filter(c=>c.st==='ok').length} of ${a.checks[s].length} passed${w.length?' · '+w.length+' waiting on you':''}</span></div><div class="card">${cs.map(c=>`<div class="check-row"><span style="color:${c.st==='ok'?'var(--good-ink)':c.st==='crit'?'var(--crit-ink)':c.st==='warn'?'var(--warn-ink)':'var(--faint)'};margin-top:2px">${c.st==='ok'?icon('check'):c.st==='na'||c.st==='ro'?'<span class="mono">–</span>':icon('alerts')}</span><div class="col" style="gap:2px"><span style="${c.st==='ok'?'':'font-weight:500'}">${esc(c.n)}</span>${c.msg?`<span class="muted">${esc(c.msg)}</span>`:''}</div><span class="st ${c.st==='ok'?'muted':''}" style="color:${c.st==='crit'?'var(--crit-ink)':c.st==='warn'?'var(--warn-ink)':''}">${{ok:'Passed',warn:'Flagged',crit:'Critical',na:'Weekly, assisted',ro:'Read-only'}[c.st]}</span></div>`).join('')}${w.map(x=>`<div class="check-row"><span style="color:var(--warn-ink);margin-top:2px">${icon('alerts')}</span><div class="col" style="gap:2px"><span style="font-weight:500">${esc(x.t)}</span><span class="muted">${esc(x.d)}</span></div><span class="st"><a href="#/a/${a.id}/today">Waiting on you</a></span></div>`).join('')}</div></div>`}).join('');
 return `<div class="content">
  <div class="card" style="padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="chips"><button class="chip ${f==='all'?'on':''}" onclick="S.checksFilter='all';render()">All checks</button><button class="chip ${f==='flags'?'on':''}" onclick="S.checksFilter='flags';render()">Flags only</button><button class="chip ${f==='ok'?'on':''}" onclick="S.checksFilter='ok';render()">Completed only</button></div>${focus?`<a href="#/a/${a.id}/checks">Show all 13 sections</a>`:''}<span class="muted" style="margin-left:auto">Mode per check comes from the Week 0 API audit: auto, assisted, or flag.</span></div>
  ${secs||'<div class="empty">Nothing in this filter.</div>'}
 </div>`;
}
// ---------- setup ----------
const SETUP_TABS=[['commercials','Commercials'],['targets','Targets'],['ads','Ads'],['pricing','Pricing and promos'],['samples','Samples'],['autonomy','Autonomy'],['guardrails','Guardrails'],['voice','Voice and knowledge'],['routing','Routing']];
function getPath(o,p){return p.split('.').reduce((x,k)=>x==null?x:x[k],o)}
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();const t=ks.reduce((x,k)=>x[k]=x[k]||{},o);t[last]=v}
function fld(a,label,path,type='number',opts={}){const v=getPath(a.settings,path);const id=a.id+'.'+path;
 let input;
 if(type==='toggle')input=`<label class="toggle ${v?'on':''}" onclick="setS('${a.id}','${path}',${!v});return false"><i></i><span>${v?'On':'Off'}</span></label>`;
 else if(type==='select')input=`<select onchange="setS('${a.id}','${path}',this.value)">${opts.options.map(o=>`<option value="${o}" ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(type==='textarea')input=`<textarea rows="2" onchange="setS('${a.id}','${path}',this.value)">${esc(v??'')}</textarea>`;
 else input=`<div class="unit"><input type="${type}" value="${esc(v??'')}" onchange="setS('${a.id}','${path}',${type==='number'?'+this.value':'this.value'})">${opts.unit?`<span>${opts.unit}</span>`:''}</div>`;
 return `<div class="field"><label>${label}</label>${input}${opts.hint?`<span class="hint">${opts.hint}</span>`:''}</div>`}
function setS(aid,path,v){const a=A[aid];setPath(a.settings,path,v);a._dirty=true;render()}
function saveS(aid){const a=A[aid];a.settings.version++;a.settings.changed.unshift({v:a.settings.version,who:'Elena K.',when:'7 Sep',what:'Edited on the '+SETUP_TABS.find(t=>t[0]===S.setupTab)[1]+' tab.'});a._dirty=false;render();toast(`Saved as v${a.settings.version}. Tomorrow’s 06:00 run uses it; today’s run stays recorded under v${a.settings.version-1}.`)}
function viewSetup(a,sub){
 const t=sub||S.setupTab;S.setupTab=t;const s=a.settings;
 const side=`<div class="card" style="padding:8px"><div class="subtabs">${SETUP_TABS.map(([k,l])=>`<a href="#/a/${a.id}/setup/${k}" class="${t===k?'on':''}">${l}</a>`).join('')}</div></div>
 <div class="card" style="padding:14px 16px;margin-top:16px"><div class="col" style="gap:8px"><span class="h">Versions</span>${s.changed.slice(0,4).map(c=>`<div style="display:flex;gap:10px"><span class="mono muted" style="width:30px;flex:none">v${c.v}</span><span><span style="font-weight:500">${esc(c.who)}, ${esc(c.when)}.</span> <span class="muted">${esc(c.what)}</span></span></div>`).join('')}<span class="muted">Every daily run records the version it ran under.</span></div></div>`;
 let body='',intro='';
 if(t==='commercials'){intro='Feeds the P&L and every margin guardrail.';body=`<div class="field-grid">${fld(a,'Monthly retainer','commercials.retainer','number',{unit:CUR[a.cur]})}${fld(a,'Currency','commercials.currency','select',{options:['EUR','GBP']})}${fld(a,'VAT','commercials.vat','number',{unit:'%'})}${fld(a,'Merchant of record','commercials.mor','toggle',{hint:'On when Brightform is MOR for this shop.'})}${fld(a,'Client parent','commercials.parent','text')}<div class="field"><label>Markets</label><div class="chips">${a.markets.map(m=>`<span class="chip on">${m}</span>`).join('')}<button class="chip" onclick="toast('Adding a market opens the market checklist: VAT, voice, hours, targets.')">+ Add market</button></div></div></div>
  <div class="sec"><div class="sec-h"><span class="h">Commission tiers on GMV</span><span class="muted">Applied monthly, per shop.</span></div><div class="card"><table class="tbl"><thead><tr><th>Up to</th><th class="r">Rate</th></tr></thead><tbody>${s.commercials.tiers.map((tr,i)=>`<tr><td class="mid"><div class="unit" style="max-width:220px"><input type="number" value="${tr.upTo??''}" placeholder="and above" onchange="setS('${a.id}','commercials.tiers.${i}.upTo',this.value===''?null:+this.value)"><span>${CUR[a.cur]}</span></div></td><td class="mid r"><div class="unit" style="max-width:120px;margin-left:auto"><input type="number" value="${tr.rate}" onchange="setS('${a.id}','commercials.tiers.${i}.rate',+this.value)"><span>%</span></div></td></tr>`).join('')}</tbody></table></div></div>
  <div class="sec"><span class="h">COGS per SKU</span><div class="card scroll"><table class="tbl"><thead><tr><th>SKU</th><th class="r">Base cost</th><th class="r">Current price</th><th class="r">Margin now</th><th class="r">Minimum price (base + ${s.pricing.minAboveBase}%)</th></tr></thead><tbody>${(a.priceRequests.length?a.priceRequests:[{sku:'Hero SKU',base:9.3,current:19.9},{sku:'Bundle',base:16.1,current:34.9}]).map(p=>`<tr><td class="mid">${esc(p.sku)}</td><td class="mid r mono">${fmtMoney2(p.base,a.cur)}</td><td class="mid r mono">${fmtMoney2(p.current,a.cur)}</td><td class="mid r mono">${pct((p.current-p.base)/p.current*100)}</td><td class="mid r mono">${fmtMoney2(p.base*(1+s.pricing.minAboveBase/100),a.cur)}</td></tr>`).join('')}<tr><td colspan="5" class="muted">Imported from the account reference sheet. <a href="#" onclick="toast('Upload a CSV with sku, base_cost, and optional vat.');return false">Upload CSV</a></td></tr></tbody></table></div></div>`}
 else if(t==='targets'){intro='What the daily checks compare against. A shop with no targets gets flagged rather than silently passing.';body=`<div class="field-grid">${fld(a,'Monthly GMV','targets.gmvMonthly','number',{unit:CUR[a.cur]})}${fld(a,'Affiliate videos per week','targets.videosWeek','number')}${fld(a,'Active collaborations','targets.activeCollabs','number')}${fld(a,'Sample rate, approved to video','targets.sampleRate','number',{unit:'%'})}${fld(a,'Outreach sends per day','targets.outreachSends','number')}${fld(a,'Outreach reply rate','targets.replyRate','number',{unit:'%'})}${fld(a,'Ads ROAS floor','targets.roasFloor','number',{unit:'× ROAS',hint:'Default for ranges without their own target on the Ads tab.'})}</div>
  ${!s.targets.gmvMonthly?`<div class="card note warn"><span style="color:var(--warn-ink)">${icon('alerts')}</span><span>No GMV target for September. Every pacing check on this account reports “no target” until one is set.</span></div>`:`<div class="card" style="padding:14px 16px"><div class="col" style="gap:6px"><span class="h">Pacing today</span><span>Month to date ${fmtMoney(a.gmv.month,a.cur)} against ${fmtMoney(s.targets.gmvMonthly*7/30,a.cur)} expected by day 7, ${pct(a.gmv.month/(s.targets.gmvMonthly*7/30)*100)} of pace.</span></div></div>`}`}
 else if(t==='ads'){intro='The executor refuses any budget above the cap. The agent rebalances inside it and pauses under the ROAS floor.';const sim=deriveAds(a);
  body=`<div class="field-grid">${fld(a,'Daily spend cap','ads.dailyCap','number',{unit:CUR[a.cur]+'/day'})}${fld(a,'Monthly spend cap','ads.monthlyCap','number',{unit:CUR[a.cur]+'/month'})}${fld(a,'Account ROAS floor','ads.roasFloor','number',{unit:'× ROAS'})}${fld(a,'Grace days under floor','ads.pauseAfterDays','number',{unit:'days',hint:'Paused once ROAS sits under the floor this long.'})}${fld(a,'GMV Max auto-optimise','ads.gmvMax','toggle')}</div>
  <div class="sec"><div class="sec-h"><span class="h">Product ranges</span><span class="muted">Budget share and ROAS target per range. Switch a range off and the agent holds its campaigns.</span></div><div class="card"><table class="tbl"><thead><tr><th>Range</th><th>On</th><th class="r">Share of budget</th><th class="r">ROAS target</th><th class="r">≈ per day</th></tr></thead><tbody>${s.ads.ranges.map((r,i)=>`<tr><td class="mid"><input type="text" value="${esc(r.name)}" onchange="setS('${a.id}','ads.ranges.${i}.name',this.value)" style="width:220px"></td><td class="mid"><label class="toggle ${r.on?'on':''}" onclick="setS('${a.id}','ads.ranges.${i}.on',${!r.on});return false"><i></i></label></td><td class="mid r"><div class="unit" style="max-width:110px;margin-left:auto"><input type="number" value="${r.share}" onchange="setS('${a.id}','ads.ranges.${i}.share',+this.value)"><span>%</span></div></td><td class="mid r"><div class="unit" style="max-width:110px;margin-left:auto"><input type="number" step="0.1" value="${r.roas}" onchange="setS('${a.id}','ads.ranges.${i}.roas',+this.value)"><span>×</span></div></td><td class="mid r mono muted">${fmtMoney(s.ads.dailyCap*r.share/100,a.cur)}</td></tr>`).join('')}<tr><td colspan="5"><button class="btn sm" onclick="A['${a.id}'].settings.ads.ranges.push({name:'New range',on:true,share:0,roas:${s.ads.roasFloor}});render()">+ Add range</button></td></tr></tbody></table></div></div>
  <div class="sec"><div class="sec-h"><span class="h">With these settings, today’s proposals</span><span class="muted">Change a number above and this re-runs.</span></div><div class="card">${sim.length?sim.map(x=>`<div class="list-row"><span class="tag ${x.kind==='auto'?'ok':x.kind==='wait'?'warn':'neutral'}">${x.kind==='auto'?'Automatic':x.kind==='wait'?'Waits for you':'Held'}</span><span style="flex:1">${esc(x.what)}</span><span class="mono muted">ROAS ${x.roas}</span></div>`).join(''):'<div class="empty">No proposals pending.</div>'}</div></div>`}
 else if(t==='pricing'){intro='Price rules the executor enforces in code, and how promos run.';const sim=derivePrices(a);
  body=`<div class="field-grid">${fld(a,'Minimum price above base','pricing.minAboveBase','number',{unit:'%',hint:'Sell price never under base cost plus this.'})}${fld(a,'Margin floor','pricing.marginFloor','number',{unit:'%'})}${fld(a,'Max discount','pricing.maxDiscount','number',{unit:'%'})}${fld(a,'Round prices to','pricing.roundTo','select',{options:['.90','.99','.00']})}</div>
  <div class="sec"><span class="h">Promotions</span><div class="field-grid">${fld(a,'Renew expiring promos at the same terms','pricing.promoAutoRenew','toggle',{hint:'Same discount, same SKUs, only if stock and margin hold.'})}${fld(a,'Do not renew under stock of','pricing.promoMinStock','number',{unit:'units'})}${fld(a,'Max promo length','pricing.promoMaxDays','number',{unit:'days'})}${fld(a,'Free shipping','pricing.freeShipping','toggle')}${fld(a,'Free shipping from','pricing.freeShipFrom','number',{unit:CUR[a.cur]})}</div></div>
  <div class="sec"><div class="sec-h"><span class="h">With these rules, pending price changes</span><span class="muted">Blocked ones wait for you with a counter-offer that passes every rule.</span></div><div class="card scroll">${sim.length?`<table class="tbl"><thead><tr><th>SKU</th><th class="r">Base</th><th class="r">Now</th><th class="r">Requested</th><th class="r">Margin</th><th>Result</th></tr></thead><tbody>${sim.map(x=>`<tr><td class="mid">${esc(x.sku)}<div class="muted">${esc(x.source)}</div></td><td class="mid r mono">${fmtMoney2(x.base,a.cur)}</td><td class="mid r mono">${fmtMoney2(x.current,a.cur)}</td><td class="mid r mono">${fmtMoney2(x.requested,a.cur)}</td><td class="mid r mono" style="${x.margin<s.pricing.marginFloor?'color:var(--crit-ink)':''}">${pct(x.margin)}</td><td class="mid">${x.kind==='auto'?'<span class="tag ok">Applies</span>':`<span class="tag warn">Blocked</span> <span class="muted">${esc(x.reasons.join('; '))}. Counter ${fmtMoney2(x.okPrice,a.cur)}.</span>`}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No price changes pending.</div>'}</div></div>`}
 else if(t==='samples'){intro='How many samples to accept, where, and what ships with them. Every request resolves against these rules at 06:00.';const sim=deriveSamples(a);const all=Object.keys(COUNTRIES);
  body=`<div class="field-grid">${fld(a,'Sample approvals','samples.on','toggle')}${fld(a,'Minimum followers','samples.minFollowers','number',{hint:'Under this, declined automatically.'})}${fld(a,'Sample value ceiling','samples.valueCeiling','number',{unit:CUR[a.cur],hint:'Above this, waits for a person.'})}${fld(a,'Ship samples together with','samples.bundle','toggle')}${fld(a,'Bundle SKU','samples.bundleWith','text',{hint:'Added to every sample parcel.'})}${fld(a,'Video expected within','samples.videoWithin','number',{unit:'days',hint:'The chase rule fires after this.'})}${fld(a,'Max samples per creator','samples.maxPerCreator','number',{unit:'/ quarter'})}</div>
  <div class="sec"><div class="sec-h"><span class="h">Countries and weekly quota</span><span class="muted">A country that is off declines every request from it.</span></div><div class="card"><table class="tbl"><thead><tr><th>Country</th><th>On</th><th class="r">Accept per week</th><th class="r">Used this week</th></tr></thead><tbody>${all.map(c=>{const on=s.samples.countries.includes(c);const used=sim.filter(x=>x.country===c&&x.kind==='approved').length;return `<tr style="${on?'':'opacity:.55'}"><td class="mid">${COUNTRIES[c]} <span class="mono muted">${c}</span></td><td class="mid"><label class="toggle ${on?'on':''}" onclick="toggleCountry('${a.id}','${c}');return false"><i></i></label></td><td class="mid r"><div class="unit" style="max-width:110px;margin-left:auto"><input type="number" value="${s.samples.weekly[c]??0}" ${on?'':'disabled'} onchange="setS('${a.id}','samples.weekly.${c}',+this.value)"></div></td><td class="mid r mono muted">${on?used+' of '+(s.samples.weekly[c]??0):'–'}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="sec"><div class="sec-h"><span class="h">With these rules, this morning’s requests</span><span class="muted">${sim.filter(x=>x.kind==='approved').length} approved · ${sim.filter(x=>x.kind==='held').length} held · ${sim.filter(x=>x.kind==='declined').length} declined · ${sim.filter(x=>x.kind==='wait').length} waiting</span></div><div class="card scroll">${sim.length?`<table class="tbl"><thead><tr><th>Creator</th><th>Country</th><th class="r">Followers</th><th>SKU</th><th class="r">Value</th><th>Result</th></tr></thead><tbody>${sim.map(x=>`<tr><td class="mid mono">${esc(x.creator)}</td><td class="mid mono">${x.country}</td><td class="mid r mono">${x.followers.toLocaleString('en-GB')}</td><td class="mid">${esc(x.sku)}</td><td class="mid r mono">${fmtMoney(x.value,a.cur)}</td><td class="mid"><span class="tag ${x.kind==='approved'?'ok':x.kind==='wait'?'warn':x.kind==='held'?'info':'neutral'}">${{approved:'Approved',held:'Held',declined:'Declined',wait:'Waits for you',blocked:'Off'}[x.kind]}</span> <span class="muted">${esc(x.why)}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No sample requests pending.</div>'}</div></div>`}
 else if(t==='autonomy'){intro='One row per job family. The override column is the number that justifies dialling up. Guardrails apply whatever is set here.';
  const stats={listing:[61,0,'None in 14 days'],promo:[14,1,'Elena, 29 Aug, ended a promo early'],price:[22,4,'Elena, 4 Sep, held a price the client wanted kept'],ads:[29,2,'Elena, 2 Sep, un-paused a campaign'],cs:[117,3,'Draft-only measurement ended 28 Aug at 93% agreement'],affiliate:[41,6,'Draft-only until 12 Sep, 85% agreement'],outreach:[210,0,'None in 14 days'],samples:[33,1,'Sofia, 1 Sep, declined a creator'],returns:[48,0,'None in 14 days'],tagging:[95,0,'None in 14 days']};
  body=`<div class="card scroll"><table class="tbl"><thead><tr><th>Job family</th><th>Setting</th><th class="r">Actions 14d</th><th class="r">Overridden</th><th>Last override</th><th></th></tr></thead><tbody>${FAMILIES.map(([k,n,d])=>{const st=stats[k];const cur=s.autonomy[k];const rate=st[0]?st[1]/st[0]*100:0;return `<tr><td class="mid"><div style="font-weight:500">${n}</div><div class="muted">${d}</div></td><td class="mid"><span class="seg">${LEVELS.map(([lv,ll])=>`<button class="${cur===lv?'on':''}" onclick="setS('${a.id}','autonomy.${k}','${lv}')">${ll}</button>`).join('')}</span></td><td class="mid r mono">${a.readOnly?0:st[0]}</td><td class="mid r mono" style="${rate>10?'color:var(--crit-ink);font-weight:500':''}">${a.readOnly?0:st[1]}</td><td class="mid muted">${a.readOnly?'Read-only':st[2]}</td><td class="mid">${!a.readOnly&&rate<=8&&st[0]>=14&&cur!=='silent'&&cur!=='off'?'<span class="tag ok">Ready to dial up</span>':rate>10?'<span class="muted">Stays on propose</span>':''}</td></tr>`}).join('')}</tbody></table></div>
  <div class="muted">Not configurable here: money out beyond cap, price outside the rules, anything client facing, and replies below confidence always wait for a person.</div>`}
 else if(t==='guardrails'){intro='Enforced in the executor, in code. The agent can propose whatever it likes and the executor still refuses.';
  body=`<div class="field-grid">${fld(a,'Max auto replies per day','guardrails.autoRepliesDay','number')}${fld(a,'Messages per creator per week','guardrails.msgsPerCreatorWeek','number')}${fld(a,'Reply confidence threshold','guardrails.confidence','number',{hint:'Below this the reply escalates with a draft.'})}${fld(a,'Blackout from','guardrails.blackoutFrom','time')}${fld(a,'Blackout to','guardrails.blackoutTo','time',{hint:'No outbound messages in this window, local time.'})}${fld(a,'Goodwill without asking','guardrails.goodwill','number',{unit:CUR[a.cur]})}${fld(a,'Stock threshold for promos and ads','guardrails.stockThreshold','number',{unit:'units',hint:'Under this, SKUs leave promos and ads pause.'})}</div>
  <div class="card" style="padding:14px 16px"><div class="col" style="gap:6px"><span class="h">Also enforced from other tabs</span><span class="muted">Ads daily cap ${fmtMoney(s.ads.dailyCap,a.cur)} and monthly cap ${fmtMoney(s.ads.monthlyCap,a.cur)} (Ads). Minimum price base + ${s.pricing.minAboveBase}%, margin floor ${s.pricing.marginFloor}%, max discount ${s.pricing.maxDiscount}% (Pricing). Sample value ceiling ${fmtMoney(s.samples.valueCeiling,a.cur)} and weekly quotas (Samples). Circuit breaker: auto-send pauses when the escalation rate leaves its normal band.</span></div></div>`}
 else if(t==='voice'){intro='Tone per market, what never gets said, what always escalates, and the knowledge library the replies are grounded in.';
  body=`<div class="sec"><span class="h">Per market</span><div class="card"><table class="tbl"><thead><tr><th>Market</th><th>Language</th><th>Tone</th><th>Working hours</th></tr></thead><tbody>${a.markets.map(m=>`<tr><td class="mid mono">${m}</td><td class="mid"><input type="text" value="${esc(s.voice.language[m])}" onchange="setS('${a.id}','voice.language.${m}',this.value)"></td><td class="mid"><input type="text" value="${esc(s.voice.tone[m])}" style="width:100%" onchange="setS('${a.id}','voice.tone.${m}',this.value)"></td><td class="mid"><input type="text" value="${esc(s.routing.hours)}" onchange="setS('${a.id}','routing.hours',this.value)"></td></tr>`).join('')}</tbody></table></div></div>
  <div class="field-grid two">${fld(a,'Banned phrases','voice.banned','textarea',{hint:'Never appear in a reply, any language.'})}${fld(a,'Always escalate on','voice.escalate','textarea',{hint:'On top of the hard triggers: health and safety, adverse reactions, legal, press, minors, chargebacks, third contact.'})}</div>
  <div class="sec"><div class="sec-h"><span class="h">Knowledge library</span><span class="muted">Five layers, most specific wins. Live state is pulled at reply time, never cached.</span></div><div class="card">${[['Brand facts','Products, ingredients, claims allowed and not, certifications, availability',92],['Policy','Shipping per market, returns, refunds, warranty, goodwill ceiling',78],['Commercial','Commission per market, sample eligibility, open collab terms',88],['Precedent','Past approved replies, the client’s actual voice',64],['Live account state','Order status, tracking, stock, promo terms right now','live']].map(([n,d,c])=>`<div class="list-row"><div class="col" style="gap:2px"><span style="font-weight:500">${n}</span><span class="muted">${d}</span></div><div class="row" style="gap:10px">${c==='live'?'<span class="tag info">Pulled at reply time</span>':`<div style="width:120px;height:8px;background:var(--surface-2);border-radius:3px;overflow:hidden"><div style="height:100%;width:${c}%;background:var(--s1)"></div></div><span class="mono" style="width:36px;text-align:right">${c}%</span>`}</div></div>`).join('')}</div></div>
  <div class="sec"><div class="sec-h"><span class="h">Suggested entries from this week’s gaps</span><span class="muted">Escalations caused by a missing fact become an entry for you to approve in one click.</span></div><div class="card">${[['Policy · pregnancy and breastfeeding','Refer to doctor or midwife, no product recommendation, offer to hold or cancel before dispatch.',4],['Brand facts · capsule size','Omega-3 capsule is 22 mm; offer the Duo (smaller softgel) as an alternative.',3]].map(([n,d,c],i)=>`<div class="list-row"><div class="col" style="gap:2px"><span style="font-weight:500">${n}</span><span class="muted">${d}</span></div><div class="row"><span class="muted" style="white-space:nowrap">${c} escalations</span><button class="btn sm" onclick="this.closest('.list-row').style.opacity=.5;toast('Approved. In the library from the next reply.')">Approve</button><button class="btn sm quiet" onclick="toast('Sent to the client contact to confirm.')">Ask client</button></div></div>`).join('')}</div></div>`}
 else if(t==='routing'){intro='Who gets what, and where. Escalations route by category.';
  body=`<div class="field-grid">${fld(a,'Account manager','routing.am','text')}${fld(a,'Account assistant','routing.aa','text')}${fld(a,'VA','routing.va','text')}${fld(a,'Approver','routing.approver','text',{hint:'Signs money out beyond cap and price overrides.'})}${fld(a,'Slack channel','routing.slack','text')}${fld(a,'Client contact','routing.client','text',{hint:'Gets the prepared one-liners for client-side execution.'})}</div>
  <div class="sec"><span class="h">Where escalations go</span><div class="card"><table class="tbl"><thead><tr><th>Category</th><th>Goes to</th><th>Also</th><th>By</th></tr></thead><tbody>${[['Money out beyond cap','Approver','AM','Slack + app'],['Price and margin','AM','Approver','Slack + app'],['Contractual and client facing','AM','','App, nothing leaves without a person'],['Low confidence replies','AA','VA on weekends','App, first response target 4h'],['Assisted, no API','AM','','Slack, weekly digest'],['Orders approaching auto-cancel','AM','Client contact at T-24h','Slack'],['Circuit breaker tripped','AM','Approver','Slack, immediately']].map(r=>`<tr><td class="mid" style="font-weight:500">${r[0]}</td><td class="mid">${r[1]}</td><td class="mid muted">${r[2]}</td><td class="mid muted">${r[3]}</td></tr>`).join('')}</tbody></table></div></div>`}
 return `<div class="content"><div style="display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start"><div>${side}</div><div class="col" style="gap:20px;min-width:0">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px"><div class="col" style="gap:4px"><span class="title" style="font-size:18px">${SETUP_TABS.find(x=>x[0]===t)[1]}</span><span class="muted">${intro}</span></div><div class="btn-row"><button class="btn primary" ${a._dirty?'':'disabled'} onclick="saveS('${a.id}')">Save as v${s.version+1}</button></div></div>
  ${body}</div></div></div>`;
}
function toggleCountry(aid,c){const s=A[aid].settings.samples;const i=s.countries.indexOf(c);if(i>=0)s.countries.splice(i,1);else{s.countries.push(c);if(s.weekly[c]==null)s.weekly[c]=5}A[aid]._dirty=true;render()}

// ---------- sign off and share ----------
function openSignoff(aid){
 const a=A[aid];const wait=waitingItems(a);const open=wait.filter(x=>!x.done);const acts=autoActions(a);const passed=SECTIONS.reduce((t,s)=>t+a.checks[s].filter(c=>c.st==='ok').length,0);const total=SECTIONS.reduce((t,s)=>t+a.checks[s].length,0);const flags=SECTIONS.reduce((t,s)=>t+a.checks[s].filter(c=>c.st==='warn'||c.st==='crit').length,0);
 const slack=`*${a.name} · ${S.todayDate} · run finished ${a.runEnd}*\n${passed} of ${total} checks passed, ${flags} flagged, ${acts.length} actions taken inside v${a.settings.version}.\n${a.findings.map(f=>'• '+f.k+': '+f.v+'. '+f.t).join('\n')}${open.length?'\n'+open.length+' still waiting on a person: '+[...new Set(open.map(x=>x.catName))].join(', '):'\nNothing waiting.'}\nSigned off by Elena K.`;
 const client=`Hi ${a.client.split(' ')[0]},\n\nQuick one from this morning’s run on ${a.name}:\n${a.findings.slice(0,2).map(f=>'– '+f.k+' '+f.v+'. '+f.t).join('\n')}\n\nNothing you need to do today${wait.some(x=>x.cat==='client'&&!x.done)?', but one thing needs your input, see below':''}.\n\nElena`;
 $('#modal').innerHTML=`<div class="modal"><div class="mh"><div class="col" style="gap:4px"><span class="title" style="font-size:18px">Sign off ${esc(a.name)}</span><span class="muted">A record that a human looked. The work did not wait for it.</span></div><button class="btn quiet" onclick="closeModal()">${icon('x')}</button></div>
 <div class="mb">
  <div class="grid4" style="gap:10px"><div class="card tile"><span class="h">Checks</span><span class="big num" style="font-size:22px">${passed}<span class="muted" style="font-size:13px">/${total}</span></span></div><div class="card tile"><span class="h">Actions</span><span class="big num" style="font-size:22px">${acts.length}</span></div><div class="card tile"><span class="h">Flags</span><span class="big num" style="font-size:22px">${flags}</span></div><div class="card tile ${open.length?'warn':''}"><span class="h">Still waiting</span><span class="big num" style="font-size:22px">${open.length}</span></div></div>
  <div class="col" style="gap:6px"><span class="h">Sections</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px">${SECTIONS.map(s=>`<span class="row" style="font-size:12.5px"><span class="dot ${sectionStatus(a,s)}"></span>${esc(s)}<span class="muted" style="margin-left:auto">${a.checks[s].filter(c=>c.st==='ok').length}/${a.checks[s].length}</span></span>`).join('')}</div></div>
  ${open.length?`<div class="card note warn"><span style="color:var(--warn-ink)">${icon('alerts')}</span><span>${open.length} item${open.length>1?'s':''} still waiting on a person. You can sign off anyway; the 18:00 sweep lists unworked items.</span></div>`:''}
  <div class="col" style="gap:8px"><div class="sec-h"><span class="h">Share</span><span class="muted">Internal goes now. Client-facing is a draft for you to send.</span></div>
   <div class="col" style="gap:6px"><label class="toggle on" id="shSlack" onclick="this.classList.toggle('on')"><i></i><span>Post summary to ${esc(a.settings.routing.slack)}</span></label><div class="pre">${esc(slack)}</div></div>
   <div class="col" style="gap:6px"><label class="toggle" id="shClient" onclick="this.classList.toggle('on')"><i></i><span>Draft client summary for ${esc(a.client)} (opens in Gmail, you send)</span></label><div class="pre" style="opacity:.8">${esc(client)}</div></div>
   <div class="col" style="gap:6px"><span class="muted">Share link to this run, read-only, expires in 7 days</span><div class="share-link"><code>ops.brightform.agency/r/${a.id}/2026-09-07/v${a.settings.version}</code><button class="btn sm" onclick="toast('Link copied.')">Copy</button></div></div>
  </div>
 </div>
 <div class="mf"><button class="btn primary" onclick="doSignoff('${a.id}')">${icon('check')}Sign off</button><button class="btn quiet" onclick="closeModal()">Not yet</button><span class="muted" style="margin-left:auto">Recorded against settings v${a.settings.version}</span></div></div>`;
 $('#modal').classList.add('open');
}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML=''}
function doSignoff(aid){const a=A[aid];const slack=$('#shSlack').classList.contains('on'),cl=$('#shClient').classList.contains('on');const d=new Date();a.signed='08:'+String(20+Math.floor(Math.random()*30)).padStart(2,'0');closeModal();render();toast(`Signed off ${a.name}.${slack?' Summary posted to '+a.settings.routing.slack+'.':''}${cl?' Client draft opened in Gmail.':''}`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
if(!location.hash)location.hash='#/accounts';
render();
</script>
