[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revfin"
version = "0.1.0"
description = "Read-only Revolut Business finance reader for Brightform. Pulls accounts, balances and transactions into SQLite and exports summaries for Claude to report on."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
revfin = "revfin.cli:app"

[tool.setuptools]
packages = ["revfin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
