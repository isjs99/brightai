# Fly.io: the recommended host (README › Hosting it for the team has the full sequence, including copying the
# SQLite file from a laptop with `fly sftp`). `fly launch --copy-config --no-deploy`, `fly volumes create sweep_data --size 1`,
# secrets from .env, then `fly deploy`.
app = "brightform-am-ops"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/sweep.db"

[mounts]
  source = "sweep_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"
